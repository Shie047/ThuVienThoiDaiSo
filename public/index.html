<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Đối Kháng - Đại Kho Vũ Khí</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #1a1a2e; color: white; font-family: sans-serif; margin: 0; padding-top: 20px; user-select: none; }
        
        /* GIAO DIỆN MENU & CỬA HÀNG */
        #menu-screen, #shop-screen { background: rgba(0,0,0,0.8); padding: 30px; border-radius: 15px; border: 2px solid #e94560; text-align: center; width: 450px; max-height: 90vh; overflow-y: auto; }
        
        /* Thanh cuộn cho Shop */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #e94560; border-radius: 10px; }

        .input-name { padding: 10px; font-size: 16px; border-radius: 8px; border: none; margin-bottom: 15px; width: 80%; text-align: center; font-weight: bold;}
        .btn { background: #e94560; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; font-weight: bold; margin: 5px; transition: 0.2s; width: 80%;}
        .btn:hover { background: #f1c40f; color: #000; }
        .btn-shop { background: #00a8ff; }
        
        .coin-display { font-size: 20px; color: #f1c40f; font-weight: bold; margin-bottom: 15px; }
        .shop-item { display: flex; justify-content: space-between; background: #333; padding: 10px; margin: 5px 0; border-radius: 5px; align-items: center; font-size: 14px;}
        
        #inventory-ui { display: none; margin-top: 15px; border-top: 1px solid #fff; padding-top: 10px; }
        .inv-btn { background: #555; padding: 5px 10px; border: none; color: white; cursor: pointer; border-radius: 4px; margin: 3px; font-size: 13px; }
        .inv-btn.active { background: #4cd137; box-shadow: 0 0 10px #4cd137; }

        /* GAME UI */
        #game-container { display: none; flex-direction: column; align-items: center; }
        .health-board { display: flex; justify-content: space-between; width: 800px; margin-bottom: 10px; }
        .health-bar-container { width: 45%; background-color: #333; height: 25px; border: 3px solid #fff; border-radius: 5px; overflow: hidden; position: relative; }
        .health-fill { height: 100%; background-color: #4cd137; width: 100%; transition: width 0.1s; }
        .player-name-tag { position: absolute; top: 2px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black;}
        #hp2-container { display: flex; justify-content: flex-end; }
        #hp2-container .player-name-tag { left: auto; right: 10px; }

        /* SÀN ĐẤU & NHÂN VẬT */
        #arena { width: 800px; height: 400px; background: linear-gradient(to bottom, #16213e 0%, #0f3460 80%, #4a4e69 100%); position: relative; border: 5px solid #fff; border-radius: 10px; overflow: hidden; }
        .player { width: 60px; height: 90px; position: absolute; background-color: #00a8ff; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        #player2 { background-color: #e84118; }
        
        .blocking { box-shadow: 0 0 20px 10px #00a8ff; border: 3px solid #fff; }
        #player2.blocking { box-shadow: 0 0 20px 10px #e84118; }
        .attacking { filter: brightness(2) drop-shadow(0 0 15px white); }
        .dead { transform: rotate(-90deg) translateY(30px) !important; filter: grayscale(100%); transition: transform 0.3s; }

        /* ================= VŨ KHÍ MỚI & CSS VẬT LÝ ================= */
        .bomb-explode { width: 140px; height: 140px; background: radial-gradient(circle, #ff9f43 0%, #ee5253 100%); border-radius: 50%; position: absolute; transform: translate(-70px, -70px); opacity: 0.8; z-index: 10; }
        
        /* 1. Súng Lục */ .bullet { position: absolute; width: 15px; height: 6px; background: #f1c40f; border-radius: 5px; box-shadow: 0 0 8px #f1c40f; }
        /* 2. Bom */ .bomb { position: absolute; width: 20px; height: 20px; background: #333; border: 2px solid red; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 10px; font-weight: bold; }
        /* 3. Phóng Lựu */ .grenade { position: absolute; width: 12px; height: 12px; background: #10ac84; border-radius: 50%; }
        /* 4. Phi Tiêu */ @keyframes spin { 100% { transform: rotate(360deg); } } .shuriken { width: 20px; height: 20px; background: #bdc3c7; clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%); animation: spin 0.2s linear infinite; position: absolute; }
        /* 5. Hoa Cải */ .shotgun_bullet { position: absolute; width: 10px; height: 10px; background: #e67e22; border-radius: 50%; box-shadow: 0 0 5px #e67e22;}
        /* 6. Sniper */ .sniper_bullet { position: absolute; width: 25px; height: 4px; background: #fff; box-shadow: 0 0 10px #fff; }
        /* 7. Cầu Lửa */ .fireball { position: absolute; width: 35px; height: 35px; background: radial-gradient(circle, #f1c40f 0%, #e84118 100%); border-radius: 50%; box-shadow: 0 0 15px #e84118; }
        /* 8. Bazooka */ .rocket { position: absolute; width: 25px; height: 12px; background: #7f8fa6; border-right: 6px solid #e84118; border-radius: 3px; }
        /* 9. Laser */ .laser { position: absolute; width: 120px; height: 6px; background: #00d2d3; box-shadow: 0 0 15px #00d2d3; }

        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #winner-text { font-size: 40px; color: #f1c40f; margin-bottom: 20px; font-weight: bold;}
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="color: #00a8ff; margin-top: 0;">ĐẤU TRƯỜNG HUYỀN THOẠI</h1>
        <div class="coin-display">Vàng: <span id="coin-count">0</span></div>
        <input type="text" id="playerNameInput" class="input-name" placeholder="Nhập tên của bạn (Vương,...)" oninput="checkEasterEgg()">
        
        <div id="inventory-ui">
            <div id="inventory-list"></div>
        </div>
        <br>
        <button class="btn" onclick="startBotMode()">ĐÁNH VỚI BOT (HARD)</button>
        <button class="btn" onclick="startOnlineMode()">TÌM TRẬN ONLINE</button>
        <button class="btn btn-shop" onclick="toggleShop(true)">CỬA HÀNG</button>
        <p id="status-text" style="color: #f1c40f; margin-top: 15px;"></p>
    </div>

    <div id="shop-screen" style="display: none;">
        <h2 style="color: #00a8ff; margin-top: 0;">CỬA HÀNG VŨ KHÍ</h2>
        <div class="coin-display">Vàng: <span id="shop-coin-count">0</span></div>
        <div id="shop-list"></div>
        <br>
        <button class="btn" style="background: #555;" onclick="toggleShop(false)">QUAY LẠI</button>
    </div>

    <div id="game-container">
        <div class="health-board">
            <div class="health-bar-container"><div id="hp1" class="health-fill"></div><div class="player-name-tag" id="name1">Player 1</div></div>
            <div class="health-bar-container" id="hp2-container"><div id="hp2" class="health-fill"></div><div class="player-name-tag" id="name2">BOT Cấp 2</div></div>
        </div>

        <div id="arena">
            <div id="player1" class="player"></div>
            <div id="player2" class="player"></div>
            
            <div id="game-over-screen">
                <div id="winner-text">K.O!</div>
                <p id="reward-text" style="color: #4cd137; font-size: 20px; display: none;">+50 Vàng</p>
                <button class="btn" id="btn-rematch" onclick="requestRematch()">ĐẤU LẠI</button>
                <button class="btn" style="background: #555;" onclick="location.reload()">VỀ MENU</button>
            </div>
        </div>
        <p style="margin-top: 15px; text-align: center;"><b>A/D</b>: Đi | <b>W</b>: Nhảy đúp | <b>Shift</b>: Đỡ Đòn | <b>Space</b>: Đánh/Bắn</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isBotMode = false;
        let myRole = 'p1';
        let currentRoom = null;
        
        // HỆ THỐNG DANH SÁCH 10 VŨ KHÍ MỚI
        const weapons = {
            gun: { name: 'Súng Lục', price: 100 },
            katana: { name: 'Kiếm Katana', price: 150 }, // Cận chiến dài
            bomb: { name: 'Mìn Hẹn Giờ', price: 200 },
            shuriken: { name: 'Phi Tiêu', price: 250 }, // Bay nhanh, dmg nhỏ
            shotgun: { name: 'Hoa Cải', price: 400 }, // Bắn chùm 3 viên
            grenade: { name: 'Phóng Lựu', price: 500 }, // Bay vòng cung
            sniper: { name: 'Súng Ngắm', price: 600 }, // Đạn xuyên thấu siêu nhanh
            fireball: { name: 'Cầu Lửa', price: 800 }, // Đạn to, bay chậm, siêu đau
            rocket: { name: 'Bazooka', price: 1000 }, // Nổ diện rộng khi chạm
            laser: { name: 'Súng Laser', price: 1500 } // Tia dài
        };

        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let unlocked = JSON.parse(localStorage.getItem('unlocked')) || {};
        let currentEquip = 'none';

        // TỰ ĐỘNG VẼ SHOP VÀ TÚI ĐỒ TỪ MẢNG WEAPONS
        function renderShopAndInventory() {
            let shopHtml = '';
            let invHtml = '<h3 style="margin: 5px 0; color: #f1c40f;">TÚI ĐỒ</h3><button class="inv-btn" id="eq-none" onclick="equipItem(\'none\')">Tay Không</button>';
            
            for(let key in weapons) {
                let w = weapons[key];
                let isOwned = unlocked[key];
                shopHtml += `<div class="shop-item"><span>${w.name} (${w.price} Vàng)</span> 
                             <button class="btn" style="width: auto; background: ${isOwned ? '#555' : '#e94560'}" onclick="buyItem('${key}', ${w.price})" id="buy-${key}">${isOwned ? 'Đã sở hữu' : 'Mua'}</button></div>`;
                invHtml += `<button class="inv-btn" onclick="equipItem('${key}')" id="eq-${key}" style="display:${isOwned ? 'inline-block' : 'none'};">${w.name}</button>`;
            }
            document.getElementById('shop-list').innerHTML = shopHtml;
            document.getElementById('inventory-list').innerHTML = invHtml;
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('shop-coin-count').innerText = coins;
            equipItem(currentEquip);
            checkEasterEgg();
        }

        function toggleShop(show) {
            document.getElementById('menu-screen').style.display = show ? 'none' : 'block';
            document.getElementById('shop-screen').style.display = show ? 'block' : 'none';
        }

        function buyItem(item, price) {
            if (unlocked[item]) return alert("Bạn đã có vũ khí này!");
            if (coins >= price) {
                coins -= price; unlocked[item] = true;
                localStorage.setItem('coins', coins); localStorage.setItem('unlocked', JSON.stringify(unlocked));
                renderShopAndInventory();
            } else alert("Không đủ vàng! Vô đánh BOT kiếm thêm đi bồ.");
        }

        function equipItem(item) {
            currentEquip = item;
            document.querySelectorAll('.inv-btn').forEach(btn => btn.classList.remove('active'));
            let activeBtn = document.getElementById(`eq-${item}`);
            if(activeBtn) activeBtn.classList.add('active');
        }

        function checkEasterEgg() {
            let name = document.getElementById('playerNameInput').value.trim().toLowerCase();
            let isNgoc = (name === "ngọc" || name === "ngoc");
            let hasAny = Object.values(unlocked).some(v => v) || isNgoc;
            
            document.getElementById('inventory-ui').style.display = hasAny ? 'block' : 'none';
            for(let key in weapons) {
                let btn = document.getElementById(`eq-${key}`);
                if (btn) btn.style.display = (unlocked[key] || isNgoc) ? 'inline-block' : 'none';
            }
        }

        // --- KHỞI TẠO GAME ---
        renderShopAndInventory();

        const groundY = 300; 
        let entities = []; 
        let p1 = { x: 50, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0, facingDir: 1 };
        let p2 = { x: 650, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0, facingDir: -1 };
        let keys = { a: false, d: false };

        const myElement = () => document.getElementById(myRole === 'p1' ? 'player1' : 'player2');
        const getMe = () => myRole === 'p1' ? p1 : p2;
        const getOpp = () => myRole === 'p1' ? p2 : p1;

        function initGame(mode, p1Name, p2Name) {
            isBotMode = (mode === 'bot');
            document.getElementById('name1').innerText = p1Name; document.getElementById('name2').innerText = p2Name;
            document.getElementById('menu-screen').style.display = 'none'; document.getElementById('game-container').style.display = 'flex';
            resetGameUI(); gameLoop();
        }

        function startBotMode() { initGame('bot', document.getElementById('playerNameInput').value || "Khách", "BOT Hủy Diệt"); }
        function startOnlineMode() { socket.emit('findMatch', document.getElementById('playerNameInput').value || "Khách"); document.getElementById('status-text').innerText = "Đang tìm đối thủ..."; }

        socket.on('matchFound', (data) => {
            myRole = data.role; currentRoom = data.roomId;
            let myN = document.getElementById('playerNameInput').value || "Khách";
            initGame('online', myRole === 'p1' ? myN : data.oppName, myRole === 'p1' ? data.oppName : myN);
        });

        // NHẬN TÍN HIỆU SERVER VÀ TỰ ĐỘNG PHÂN LOẠI VŨ KHÍ MỚI
        socket.on('updateOpponent', (oppData) => {
            let opp = getOpp();
            opp.x = oppData.x; opp.y = oppData.y; opp.isBlocking = oppData.isBlocking;
            if (oppData.facingDir) opp.facingDir = oppData.facingDir;
            document.getElementById(myRole === 'p1' ? 'player2' : 'player1').classList.toggle('blocking', opp.isBlocking);
        });

        socket.on('takeDamage', (dmg) => handleDamage(getMe(), dmg));
        socket.on('opponentBomb', (d) => spawnEntity('bomb', d.x, d.y, 0, 0, false));
        socket.on('opponentGrenade', (d) => spawnEntity('grenade', d.x, d.y, d.vx, d.vy, false));
        // Server cũ gửi opponentShoot, ta bắt lấy và đẻ ra đúng type đạn
        socket.on('opponentShoot', (d) => spawnEntity(d.type || 'bullet', d.x, d.y, d.vx, d.vy || 0, false));

        // --- CƠ CHẾ BẮN & KỸ NĂNG ---
        function doAttack() {
            let me = getMe();
            if(me.isDead || me.isBlocking) return;
            myElement().classList.add('attacking'); setTimeout(() => myElement().classList.remove('attacking'), 150);

            let dir = me.facingDir; 
            
            // CẬN CHIẾN (Tay không & Katana)
            if (currentEquip === 'none' || currentEquip === 'katana') {
                let dmg = currentEquip === 'katana' ? 25 : 15;
                let range = currentEquip === 'katana' ? 120 : 80;
                let opp = getOpp();
                let isFacingOpponent = (dir === 1 && opp.x > me.x) || (dir === -1 && opp.x < me.x);
                
                if(Math.abs(me.x - opp.x) < range && Math.abs(me.y - opp.y) < 50 && !opp.isDead && isFacingOpponent) {
                    if(!isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: dmg });
                    handleDamage(opp, dmg);
                }
            } 
            // ĐẠN TẦM XA
            else {
                let px = me.x + 30; let py = me.y + 40;
                
                if (currentEquip === 'gun') spawnAndSend('bullet', px, py, dir*15, 0);
                else if (currentEquip === 'shuriken') spawnAndSend('shuriken', px, py, dir*22, 0); // Nhanh
                else if (currentEquip === 'sniper') spawnAndSend('sniper_bullet', px, py, dir*35, 0); // Cực nhanh
                else if (currentEquip === 'laser') spawnAndSend('laser', px, py, dir*25, 0);
                else if (currentEquip === 'fireball') spawnAndSend('fireball', px, py-10, dir*8, 0); // Chậm, to
                else if (currentEquip === 'rocket') spawnAndSend('rocket', px, py, dir*12, 0);
                else if (currentEquip === 'shotgun') {
                    spawnAndSend('shotgun_bullet', px, py, dir*14, -2);
                    spawnAndSend('shotgun_bullet', px, py, dir*14, 0);
                    spawnAndSend('shotgun_bullet', px, py, dir*14, 2);
                }
                else if (currentEquip === 'bomb') {
                    spawnEntity('bomb', me.x+20, groundY+70, 0, 0, true);
                    if(!isBotMode) socket.emit('throwBomb', { roomId: currentRoom, x: me.x+20, y: groundY+70 });
                }
                else if (currentEquip === 'grenade') {
                    spawnEntity('grenade', px, me.y, dir*10, -12, true); 
                    if(!isBotMode) socket.emit('shootGrenade', { roomId: currentRoom, x: px, y: me.y, vx: dir*10, vy: -12 });
                }
            }
        }

        // Gửi qua hàm shoot cũ của Server
        function spawnAndSend(type, x, y, vx, vy) {
            spawnEntity(type, x, y, vx, vy, true);
            if (!isBotMode) socket.emit('shoot', { roomId: currentRoom, type: type, x: x, y: y, vx: vx, vy: vy });
        }

        function handleDamage(target, dmg) {
            if(target.isDead) return;
            if (target.isBlocking) dmg = Math.floor(dmg * 0.2); 
            target.hp -= dmg;
            
            let hpFill = target === p1 ? document.getElementById('hp1') : document.getElementById('hp2');
            hpFill.style.width = Math.max(0, target.hp) + '%';
            if(target.hp <= 30) hpFill.style.backgroundColor = '#e84118'; else hpFill.style.backgroundColor = '#4cd137';

            if(target.hp <= 0) {
                target.isDead = true;
                (target === p1 ? document.getElementById('player1') : document.getElementById('player2')).classList.add('dead');
                setTimeout(() => {
                    document.getElementById('game-over-screen').style.display = 'flex';
                    let isIWon = (target === getOpp());
                    document.getElementById('winner-text').innerText = isIWon ? "BẠN ĐÃ THẮNG!" : "BẠN ĐÃ THUA!";
                    document.getElementById('winner-text').style.color = isIWon ? "#4cd137" : "#e84118";
                    
                    if (isIWon && isBotMode) {
                        coins += 50; localStorage.setItem('coins', coins); renderShopAndInventory();
                        document.getElementById('reward-text').style.display = 'block';
                    } else document.getElementById('reward-text').style.display = 'none';
                }, 500);
            }
        }

        function spawnEntity(type, x, y, vx, vy, isMine) {
            let el = document.createElement('div'); el.className = type;
            document.getElementById('arena').appendChild(el);
            let entity = { type: type, x: x, y: y, vx: vx, vy: vy, el: el, isMine: isMine, age: 0 };
            
            if (type === 'bomb') {
                el.innerText = "3"; entity.timer = 3;
                let countdown = setInterval(() => {
                    entity.timer--; if(el) el.innerText = entity.timer;
                    if(entity.timer <= 0) clearInterval(countdown);
                }, 1000);
            }
            entities.push(entity);
        }

        function updateEntities() {
            for(let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i]; e.age++;

                // Áp dụng trọng lực cho Lựu đạn và đạn Shotgun tỏa
                if (e.type === 'grenade') { e.x += e.vx; e.y += e.vy; e.vy += 0.8; }
                else { e.x += e.vx; e.y += e.vy; } 

                e.el.style.left = e.x + 'px'; e.el.style.top = e.y + 'px';

                let target = e.isMine ? getOpp() : getMe();

                // Nổ mìn
                if (e.type === 'bomb') {
                    if (e.age > 180) { 
                        e.el.className = 'bomb-explode'; e.el.innerText = "";
                        if (Math.abs(e.x - target.x) < 80 && Math.abs(e.y - target.y) < 80) {
                            if (e.isMine && !isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: 30 });
                            if (e.isMine) handleDamage(target, 30);
                        }
                        setTimeout(() => { if(e.el && e.el.parentNode) e.el.remove(); }, 300);
                        entities.splice(i, 1);
                    }
                    continue;
                } 
                
                // Logic va chạm cho các vũ khí còn lại
                let w = 15, h = 15, dmg = 15, isExplosive = false;
                switch(e.type) {
                    case 'shuriken': dmg = 8; break;
                    case 'shotgun_bullet': dmg = 10; w = 10; break;
                    case 'sniper_bullet': dmg = 35; w = 25; break;
                    case 'fireball': dmg = 45; w = 35; h = 35; break;
                    case 'rocket': dmg = 35; isExplosive = true; break;
                    case 'laser': dmg = 20; w = 120; break;
                    case 'grenade': dmg = 25; break;
                }

                if (e.x > target.x - w && e.x < target.x + 60 && e.y > target.y - h && e.y < target.y + 90 && !target.isDead) {
                    if (e.type === 'rocket' && e.vx !== 0) {
                        e.el.className = 'bomb-explode'; e.vx = 0; e.vy = 0; // Tên lửa nổ ngay khi chạm
                        if (e.isMine) {
                            if (!isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: dmg });
                            handleDamage(target, dmg);
                        }
                        setTimeout(() => { if(e.el && e.el.parentNode) e.el.remove(); }, 300);
                    } else if (e.vx !== 0) {
                        if (e.isMine) {
                            if (!isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: dmg });
                            handleDamage(target, dmg);
                        }
                        e.el.remove(); entities.splice(i, 1); continue;
                    }
                }

                // Hủy đạn khi bay ra ngoài bản đồ hoặc rớt xuống đất
                if ((e.type === 'grenade' && e.y > groundY + 70) || e.x < -100 || e.x > 900) {
                    e.el.remove(); entities.splice(i, 1);
                }
            }
        }

        // --- BOT AI ---
        let botWait = 0; 
        function runBotAI() {
            let bot = p2; let player = p1;
            if(bot.isDead || player.isDead) return;

            let bulletNear = entities.some(e => e.isMine && Math.abs(e.x - bot.x) < 150);
            if (bulletNear && Math.random() < 0.6) { bot.isBlocking = true; return; } 
            else bot.isBlocking = false;

            let dist = bot.x - player.x; botWait--;
            if (botWait > 0) return; 

            if (dist > 80) { bot.x -= 5; bot.facingDir = -1; }
            else if (dist < -80) { bot.x += 5; bot.facingDir = 1; }
            else {
                bot.facingDir = dist > 0 ? -1 : 1; 
                if (Math.random() < 0.12) { 
                    document.getElementById('player2').classList.add('attacking'); setTimeout(() => document.getElementById('player2').classList.remove('attacking'), 150);
                    handleDamage(player, 15); botWait = 20;
                }
            }
        }

        // --- BÀN PHÍM ---
        window.addEventListener('keydown', (e) => {
            let me = getMe(); if(me.isDead) return;
            if(e.key === 'a' || e.key === 'A') keys.a = true;
            if(e.key === 'd' || e.key === 'D') keys.d = true;
            if(e.key === 'w' || e.key === 'W') {
                if(me.y >= groundY) { me.vy = -15; me.jumpCount = 1; } else if (me.jumpCount === 1) { me.vy = -12; me.jumpCount = 2; }
            }
            if(e.key === 'Shift') { me.isBlocking = true; myElement().classList.add('blocking'); }
            if(e.code === 'Space' && !e.repeat) doAttack();
        });

        window.addEventListener('keyup', (e) => {
            let me = getMe();
            if(e.key === 'a' || e.key === 'A') keys.a = false;
            if(e.key === 'd' || e.key === 'D') keys.d = false;
            if(e.key === 'Shift') { me.isBlocking = false; myElement().classList.remove('blocking'); }
        });

        function resetGameUI() {
            document.getElementById('game-over-screen').style.display = 'none';
            p1 = { x: 50, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0, facingDir: 1 };
            p2 = { x: 650, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0, facingDir: -1 };
            entities.forEach(e => e.el.remove()); entities = [];
            document.getElementById('player1').className = 'player'; document.getElementById('player2').className = 'player';
            document.getElementById('hp1').style.width = '100%'; document.getElementById('hp1').style.backgroundColor = '#4cd137';
            document.getElementById('hp2').style.width = '100%'; document.getElementById('hp2').style.backgroundColor = '#4cd137';
        }

        socket.on('rematchOffer', () => { document.getElementById('btn-rematch').innerText = "Đối thủ rủ đấu lại! Bấm để đồng ý"; document.getElementById('btn-rematch').style.background = "#4cd137"; });
        socket.on('rematchStart', () => resetGameUI());
        function requestRematch() {
            if (isBotMode) resetGameUI();
            else { document.getElementById('btn-rematch').innerText = "Đang chờ đối thủ đồng ý..."; socket.emit('rematchRequest', currentRoom); }
        }

        function gameLoop() {
            let me = getMe();

            if (!p1.isDead && !p2.isDead) {
                if(isBotMode) runBotAI();

                let speed = me.isBlocking ? 2 : 6;
                if(keys.a) { me.x = Math.max(0, me.x - speed); me.facingDir = -1; }
                if(keys.d) { me.x = Math.min(800 - 60, me.x + speed); me.facingDir = 1; }

                me.y += me.vy;
                if (me.y < groundY) me.vy += 0.8; else { me.y = groundY; me.vy = 0; me.jumpCount = 0; }

                if(!isBotMode) socket.emit('playerAction', { roomId: currentRoom, playerData: { x: me.x, y: me.y, isBlocking: me.isBlocking, facingDir: me.facingDir } });
            }

            document.getElementById('player1').style.left = p1.x + 'px'; document.getElementById('player1').style.top = p1.y + 'px';
            document.getElementById('player2').style.left = p2.x + 'px'; document.getElementById('player2').style.top = p2.y + 'px';

            if(!p1.isDead) document.getElementById('player1').style.transform = `scaleX(${p1.facingDir})`;
            if(!p2.isDead) document.getElementById('player2').style.transform = `scaleX(${p2.facingDir})`;

            updateEntities(); requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
