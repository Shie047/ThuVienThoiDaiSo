<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Đối Kháng - Bản Tối Ưu Đặc Biệt</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #1a1a2e; color: white; font-family: sans-serif; margin: 0; padding-top: 30px; user-select: none; }
        
        /* MENU & UI */
        #menu-screen { text-align: center; background: rgba(0,0,0,0.8); padding: 40px; border-radius: 15px; border: 2px solid #e94560; }
        .input-name { padding: 15px; font-size: 18px; border-radius: 8px; border: none; margin-bottom: 20px; width: 250px; text-align: center; font-weight: bold;}
        .btn-play { background: #e94560; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; font-weight: bold; margin: 5px; transition: 0.2s; }
        .btn-play:hover { background: #f1c40f; color: #000; }
        
        #game-container { display: none; flex-direction: column; align-items: center; }
        
        /* THANH MÁU */
        .health-board { display: flex; justify-content: space-between; width: 800px; margin-bottom: 10px; }
        .health-bar-container { width: 45%; background-color: #333; height: 25px; border: 3px solid #fff; border-radius: 5px; overflow: hidden; position: relative; }
        .health-fill { height: 100%; background-color: #4cd137; width: 100%; transition: width 0.1s; }
        .player-name-tag { position: absolute; top: 2px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black;}
        #hp2-container { display: flex; justify-content: flex-end; }
        #hp2-container .player-name-tag { left: auto; right: 10px; }

        /* SÀN ĐẤU & NHÂN VẬT */
        #arena { width: 800px; height: 400px; background: linear-gradient(to bottom, #16213e 0%, #0f3460 80%, #4a4e69 100%); position: relative; border: 5px solid #fff; border-radius: 10px; overflow: hidden; }
        .player { width: 80px; height: 100px; position: absolute; background-color: #00a8ff; border-radius: 10px; display: flex; justify-content: center; }
        #player2 { background-color: #e84118; }
        .attacking { filter: brightness(2) drop-shadow(0 0 15px white); }
        .dead { transform: rotate(-90deg) translateY(30px); filter: grayscale(100%); transition: transform 0.3s; }

        /* VŨ KHÍ (SÚNG) & ĐẠN */
        .gun { width: 30px; height: 10px; background-color: #7f8fa6; position: absolute; top: 40px; display: none; border-radius: 2px; }
        #player1 .gun { right: -20px; }
        #player2 .gun { left: -20px; }
        .is-thanh .gun { display: block !important; } /* Hiện súng nếu tên là Thành */
        .bullet { position: absolute; width: 15px; height: 6px; background: #f1c40f; border-radius: 5px; box-shadow: 0 0 8px #f1c40f; z-index: 10; }

        /* MÀN HÌNH GAME OVER */
        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #winner-text { font-size: 40px; color: #f1c40f; margin-bottom: 20px; text-transform: uppercase; text-shadow: 2px 2px 5px red; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="color: #00a8ff;">ĐẤU TRƯỜNG HUYỀN THOẠI</h1>
        <input type="text" id="playerNameInput" class="input-name" placeholder="Nhập tên của bạn (VD: Thành)">
        <br>
        <button class="btn-play" onclick="startBotMode()">🤖 CHƠI VỚI MÁY</button>
        <button class="btn-play" onclick="startOnlineMode()">🌐 TÌM TRẬN ONLINE</button>
        <p id="status-text" style="color: #f1c40f; margin-top: 15px;"></p>
    </div>

    <div id="game-container">
        <div class="health-board">
            <div class="health-bar-container">
                <div id="hp1" class="health-fill"></div>
                <div class="player-name-tag" id="name1">Player 1</div>
            </div>
            <div class="health-bar-container" id="hp2-container">
                <div id="hp2" class="health-fill"></div>
                <div class="player-name-tag" id="name2">Player 2</div>
            </div>
        </div>

        <div id="arena">
            <div id="player1" class="player"><div class="gun"></div></div>
            <div id="player2" class="player"><div class="gun"></div></div>
            
            <div id="game-over-screen">
                <div id="winner-text">BẠN ĐÃ THẮNG!</div>
                <button class="btn-play" id="btn-rematch" onclick="requestRematch()">ĐẤU LẠI</button>
                <button class="btn-play" style="background: #555;" onclick="location.reload()">THOÁT</button>
            </div>
        </div>
        <p style="margin-top: 20px;"><b>W</b>: Nhảy | <b>A/D</b>: Di chuyển | <b>Shift</b>: Lướt | <b>Space</b>: Đánh/Bắn</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isBotMode = false;
        let myRole = 'p1';
        let currentRoom = null;
        let myName = "";
        let hasGun = false;

        // VẬT LÝ & THÔNG SỐ
        const gravity = 1.2;
        const groundY = 280; 
        const attackRange = 90;
        const damage = 10;
        let bullets = []; // Mảng chứa đạn

        let p1 = { x: 100, y: groundY, vy: 0, hp: 100, isDead: false, isAttacking: false, isDashing: false };
        let p2 = { x: 600, y: groundY, vy: 0, hp: 100, isDead: false, isAttacking: false, isDashing: false };
        
        let keys = { a: false, d: false };

        const myElement = () => document.getElementById(myRole === 'p1' ? 'player1' : 'player2');
        const oppElement = () => document.getElementById(myRole === 'p1' ? 'player2' : 'player1');
        const getMe = () => myRole === 'p1' ? p1 : p2;
        const getOpp = () => myRole === 'p1' ? p2 : p1;

        // --- KHỞI ĐỘNG GAME ---
        function getPlayerName() {
            let name = document.getElementById('playerNameInput').value.trim();
            return name === "" ? "Khách" : name;
        }

        function setupThanhEasterEgg(name, elementId) {
            if (name.toLowerCase() === 'thành' || name.toLowerCase() === 'thanh') {
                document.getElementById(elementId).classList.add('is-thanh');
                return true;
            }
            document.getElementById(elementId).classList.remove('is-thanh');
            return false;
        }

        function startBotMode() {
            isBotMode = true;
            myName = getPlayerName();
            hasGun = setupThanhEasterEgg(myName, 'player1');
            
            document.getElementById('name1').innerText = myName;
            document.getElementById('name2').innerText = "BOT Cấp 1";
            setupThanhEasterEgg("Bot", 'player2'); // Bot không có súng

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            resetGameUI();
            gameLoop();
        }

        function startOnlineMode() {
            myName = getPlayerName();
            socket.emit('findMatch', myName);
            document.getElementById('status-text').innerText = "Đang tìm đối thủ...";
        }

        // --- SOCKET EVENT TỪ SERVER ---
        socket.on('matchFound', (data) => {
            isBotMode = false;
            myRole = data.role;
            currentRoom = data.roomId;
            
            hasGun = setupThanhEasterEgg(myName, myRole === 'p1' ? 'player1' : 'player2');
            setupThanhEasterEgg(data.oppName, myRole === 'p1' ? 'player2' : 'player1');

            document.getElementById('name1').innerText = myRole === 'p1' ? myName : data.oppName;
            document.getElementById('name2').innerText = myRole === 'p1' ? data.oppName : myName;

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            resetGameUI();
            gameLoop();
        });

        socket.on('updateOpponent', (oppData) => {
            let opp = getOpp();
            opp.x = oppData.x; opp.y = oppData.y;
            if(oppData.isAttacking) showAttackEffect(oppElement());
        });

        socket.on('takeDamage', (dmg) => {
            handleDamage(getMe(), dmg);
        });

        socket.on('opponentShoot', (data) => {
            spawnBullet(data.x, data.y, data.speed, false);
        });

        // ĐẤU LẠI (REMATCH) ONLINE
        socket.on('rematchOffer', () => {
            document.getElementById('btn-rematch').innerText = "Đối thủ rủ đấu lại! Bấm để đồng ý";
            document.getElementById('btn-rematch').style.background = "#4cd137";
        });

        socket.on('rematchStart', () => {
            resetGameUI();
        });

        function requestRematch() {
            if (isBotMode) {
                resetGameUI();
            } else {
                document.getElementById('btn-rematch').innerText = "Đang chờ đối thủ đồng ý...";
                socket.emit('rematchRequest', currentRoom);
            }
        }

        // --- LOGIC HÀNH ĐỘNG ---
        function showAttackEffect(el) {
            el.classList.add('attacking');
            setTimeout(() => el.classList.remove('attacking'), 150);
        }

        function doAttack() {
            let me = getMe();
            let opp = getOpp();
            if(me.isDead || me.isAttacking) return;

            me.isAttacking = true;
            showAttackEffect(myElement());

            if (hasGun) {
                // TÍNH NĂNG ĐẶC QUYỀN CỦA THÀNH: BẮN SÚNG
                let bulletSpeed = myRole === 'p1' ? 12 : -12; 
                spawnBullet(me.x + 40, me.y + 40, bulletSpeed, true);
                if (!isBotMode) socket.emit('shoot', { roomId: currentRoom, x: me.x + 40, y: me.y + 40, speed: bulletSpeed });
            } else {
                // ĐÁNH GẦN BÌNH THƯỜNG
                let dist = Math.abs(me.x - opp.x);
                let heightDiff = Math.abs(me.y - opp.y); 

                if(dist < attackRange && heightDiff < 50 && !opp.isDead) {
                    if (!isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: damage });
                    handleDamage(opp, damage);
                }
            }

            setTimeout(() => { me.isAttacking = false; }, 200); // Tốc độ đánh
        }

        function handleDamage(target, dmg) {
            if(target.isDead) return;
            target.hp -= dmg;
            
            // Cập nhật giao diện thanh máu
            let hpFill = target === p1 ? document.getElementById('hp1') : document.getElementById('hp2');
            hpFill.style.width = Math.max(0, target.hp) + '%';
            if(target.hp <= 30) hpFill.style.backgroundColor = '#e84118';
            else if(target.hp <= 60) hpFill.style.backgroundColor = '#fbc531';
            else hpFill.style.backgroundColor = '#4cd137';

            if(target.hp <= 0) {
                target.isDead = true;
                let el = target === p1 ? document.getElementById('player1') : document.getElementById('player2');
                el.classList.add('dead');
                
                // Hiển thị màn hình Game Over
                setTimeout(() => {
                    document.getElementById('game-over-screen').style.display = 'flex';
                    let isIWon = (target === getOpp());
                    document.getElementById('winner-text').innerText = isIWon ? "BẠN ĐÃ CHIẾN THẮNG!" : "BẠN ĐÃ THUA!";
                    document.getElementById('winner-text').style.color = isIWon ? "#4cd137" : "#e84118";
                    document.getElementById('btn-rematch').innerText = "ĐẤU LẠI";
                    document.getElementById('btn-rematch').style.background = "#e94560";
                }, 500);
            }
        }

        // --- LOGIC ĐẠN BAY ---
        function spawnBullet(x, y, speed, isMine) {
            let el = document.createElement('div');
            el.className = 'bullet';
            document.getElementById('arena').appendChild(el);
            bullets.push({ x: x, y: y, speed: speed, el: el, isMine: isMine });
        }

        function updateBullets() {
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.speed;
                b.el.style.left = b.x + 'px';
                b.el.style.top = b.y + 'px';

                let target = b.isMine ? getOpp() : getMe();
                
                // Kiểm tra chạm (Hitbox đạn với người)
                if (b.x > target.x && b.x < target.x + 80 && b.y > target.y && b.y < target.y + 100 && !target.isDead) {
                    if (b.isMine) { // Chỉ người bắn mới gửi lệnh trừ máu để tránh lag trừ 2 lần
                        if (!isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: damage });
                        handleDamage(target, damage);
                    }
                    b.el.remove();
                    bullets.splice(i, 1);
                    continue;
                }

                // Xóa đạn khi bay ra khỏi bản đồ
                if (b.x < 0 || b.x > 800) {
                    b.el.remove();
                    bullets.splice(i, 1);
                }
            }
        }

        // --- BOT AI ---
        function runBotAI() {
            let bot = p2; let player = p1;
            if(bot.isDead || player.isDead) return;

            let dist = bot.x - player.x;
            keys.ArrowLeft = false; keys.ArrowRight = false;

            if (dist > 70) keys.ArrowLeft = true;
            else if (dist < -70) keys.ArrowRight = true;
            else {
                // Đủ gần -> Đấm
                if (Math.random() < 0.08) {
                    bot.isAttacking = true;
                    showAttackEffect(document.getElementById('player2'));
                    handleDamage(player, damage);
                    setTimeout(() => bot.isAttacking = false, 200);
                }
            }
        }

        // --- ĐIỀU KHIỂN BÀN PHÍM ---
        window.addEventListener('keydown', (e) => {
            if(getMe().isDead) return;
            if(e.key === 'a' || e.key === 'A') keys.a = true;
            if(e.key === 'd' || e.key === 'D') keys.d = true;
            if((e.key === 'w' || e.key === 'W') && getMe().y >= groundY) getMe().vy = -18;
            if(e.key === 'Shift' && !getMe().isDashing) {
                getMe().isDashing = true;
                setTimeout(() => getMe().isDashing = false, 200);
            }
            if(e.code === 'Space' && !e.repeat) doAttack();
        });

        window.addEventListener('keyup', (e) => {
            if(e.key === 'a' || e.key === 'A') keys.a = false;
            if(e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // --- RESET GAME KHI ĐẤU LẠI ---
        function resetGameUI() {
            document.getElementById('game-over-screen').style.display = 'none';
            p1 = { x: 100, y: groundY, vy: 0, hp: 100, isDead: false, isAttacking: false, isDashing: false };
            p2 = { x: 600, y: groundY, vy: 0, hp: 100, isDead: false, isAttacking: false, isDashing: false };
            bullets.forEach(b => b.el.remove());
            bullets = [];
            
            document.getElementById('player1').classList.remove('dead');
            document.getElementById('player2').classList.remove('dead');
            
            document.getElementById('hp1').style.width = '100%'; document.getElementById('hp1').style.backgroundColor = '#4cd137';
            document.getElementById('hp2').style.width = '100%'; document.getElementById('hp2').style.backgroundColor = '#4cd137';
        }

        // --- VÒNG LẶP CHÍNH (60 FPS) ---
        function gameLoop() {
            let me = getMe();

            if (!p1.isDead && !p2.isDead) {
                if(isBotMode) runBotAI();

                // Logic di chuyển mượt mà của bản thân
                let moveSpeed = me.isDashing ? 15 : 6;
                if(keys.a) me.x = Math.max(0, me.x - moveSpeed);
                if(keys.d) me.x = Math.min(800 - 80, me.x + moveSpeed);

                // Trọng lực nhảy
                me.y += me.vy;
                if (me.y < groundY) me.vy += gravity; 
                else { me.y = groundY; me.vy = 0; }

                // Bot di chuyển (chỉ áp dụng nếu chơi offline)
                if(isBotMode) {
                    if(keys.ArrowLeft) p2.x = Math.max(0, p2.x - 5);
                    if(keys.ArrowRight) p2.x = Math.min(800 - 80, p2.x + 5);
                }

                // Gửi dữ liệu cho Server nếu đang chơi Online
                if(!isBotMode) {
                    socket.emit('playerAction', {
                        roomId: currentRoom,
                        playerData: { x: me.x, y: me.y, isAttacking: me.isAttacking }
                    });
                }
            }

            // Vẽ lại giao diện nhân vật
            document.getElementById('player1').style.left = p1.x + 'px';
            document.getElementById('player1').style.top = p1.y + 'px';
            document.getElementById('player2').style.left = p2.x + 'px';
            document.getElementById('player2').style.top = p2.y + 'px';

            updateBullets(); // Cập nhật vị trí đạn bay

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
