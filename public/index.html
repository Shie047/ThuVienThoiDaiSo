<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Đối Kháng - Bản Nâng Cấp Tối Thượng</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #1a1a2e; color: white; font-family: sans-serif; margin: 0; padding-top: 20px; user-select: none; }
        
        /* GIAO DIỆN MENU & CỬA HÀNG */
        #menu-screen, #shop-screen { background: rgba(0,0,0,0.8); padding: 30px; border-radius: 15px; border: 2px solid #e94560; text-align: center; width: 400px; }
        .input-name { padding: 10px; font-size: 16px; border-radius: 8px; border: none; margin-bottom: 15px; width: 80%; text-align: center; font-weight: bold;}
        .btn { background: #e94560; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; font-weight: bold; margin: 5px; transition: 0.2s; width: 80%;}
        .btn:hover { background: #f1c40f; color: #000; }
        .btn-shop { background: #00a8ff; }
        
        .coin-display { font-size: 20px; color: #f1c40f; font-weight: bold; margin-bottom: 15px; }
        .shop-item { display: flex; justify-content: space-between; background: #333; padding: 10px; margin: 5px 0; border-radius: 5px; align-items: center;}
        
        #inventory-ui { display: none; margin-top: 15px; border-top: 1px solid #fff; padding-top: 10px; }
        .inv-btn { background: #555; padding: 5px 10px; border: none; color: white; cursor: pointer; border-radius: 4px; margin: 2px; }
        .inv-btn.active { background: #4cd137; }

        /* GAME UI */
        #game-container { display: none; flex-direction: column; align-items: center; }
        .health-board { display: flex; justify-content: space-between; width: 800px; margin-bottom: 10px; }
        .health-bar-container { width: 45%; background-color: #333; height: 25px; border: 3px solid #fff; border-radius: 5px; overflow: hidden; position: relative; }
        .health-fill { height: 100%; background-color: #4cd137; width: 100%; transition: width 0.1s; }
        .player-name-tag { position: absolute; top: 2px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black;}
        #hp2-container { display: flex; justify-content: flex-end; }
        #hp2-container .player-name-tag { left: auto; right: 10px; }

        /* SÀN ĐẤU & NHÂN VẬT */
        #arena { width: 800px; height: 400px; background: linear-gradient(to bottom, #16213e 0%, #0f3460 80%, #4a4e69 100%); position: relative; border: 5px solid #fff; border-radius: 10px; overflow: hidden; }
        .player { width: 60px; height: 90px; position: absolute; background-color: #00a8ff; border-radius: 10px; display: flex; justify-content: center; align-items: center;}
        #player2 { background-color: #e84118; }
        
        /* Hiệu ứng Đỡ đòn & Đánh */
        .blocking { box-shadow: 0 0 20px 10px #00a8ff; border: 3px solid #fff; }
        #player2.blocking { box-shadow: 0 0 20px 10px #e84118; }
        .attacking { filter: brightness(2) drop-shadow(0 0 15px white); transform: scale(1.1); }
        .dead { transform: rotate(-90deg) translateY(30px); filter: grayscale(100%); transition: transform 0.3s; }

        /* VẬT PHẨM */
        .bullet { position: absolute; width: 15px; height: 6px; background: #f1c40f; border-radius: 5px; box-shadow: 0 0 8px #f1c40f; }
        .bomb { position: absolute; width: 20px; height: 20px; background: #333; border: 2px solid red; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 10px; font-weight: bold; }
        .bomb-explode { width: 120px; height: 120px; background: radial-gradient(circle, #ff9f43 0%, #ee5253 100%); border-radius: 50%; position: absolute; transform: translate(-50px, -50px); opacity: 0.8; z-index: 10; }
        .grenade { position: absolute; width: 12px; height: 12px; background: #10ac84; border-radius: 50%; }

        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #winner-text { font-size: 40px; color: #f1c40f; margin-bottom: 20px; font-weight: bold;}
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="color: #00a8ff;">ĐẤU TRƯỜNG HUYỀN THOẠI</h1>
        <div class="coin-display">💰 Vàng: <span id="coin-count">0</span></div>
        <input type="text" id="playerNameInput" class="input-name" placeholder="Nhập tên của bạn (Ngọc = VIP)" oninput="checkEasterEgg()">
        
        <div id="inventory-ui">
            <h3 style="margin: 5px 0; color: #f1c40f;">TÚI ĐỒ CỦA BẠN</h3>
            <button class="inv-btn active" onclick="equipItem('none')" id="eq-none">Tay Không</button>
            <button class="inv-btn" onclick="equipItem('gun')" id="eq-gun" style="display:none;">Súng Lục</button>
            <button class="inv-btn" onclick="equipItem('bomb')" id="eq-bomb" style="display:none;">Mìn Hẹn Giờ</button>
            <button class="inv-btn" onclick="equipItem('grenade')" id="eq-grenade" style="display:none;">Súng Phóng Lựu</button>
        </div>
        <br><br>
        <button class="btn" onclick="startBotMode()">🤖 ĐÁNH VỚI BOT</button>
        <button class="btn" onclick="startOnlineMode()">🌐 TÌM TRẬN ONLINE</button>
        <button class="btn btn-shop" onclick="toggleShop(true)">🛒 CỬA HÀNG</button>
        <p id="status-text" style="color: #f1c40f; margin-top: 15px;"></p>
    </div>

    <div id="shop-screen" style="display: none;">
        <h2 style="color: #00a8ff;">CỬA HÀNG VŨ KHÍ</h2>
        <div class="coin-display">💰 Vàng: <span id="shop-coin-count">0</span></div>
        
        <div class="shop-item"><span>Súng Lục (100 Vàng)</span> <button class="btn" style="width: auto;" onclick="buyItem('gun', 100)" id="buy-gun">Mua</button></div>
        <div class="shop-item"><span>Mìn Hẹn Giờ (200 Vàng)</span> <button class="btn" style="width: auto;" onclick="buyItem('bomb', 200)" id="buy-bomb">Mua</button></div>
        <div class="shop-item"><span>Phóng Lựu (500 Vàng)</span> <button class="btn" style="width: auto;" onclick="buyItem('grenade', 500)" id="buy-grenade">Mua</button></div>
        <br>
        <button class="btn" style="background: #555;" onclick="toggleShop(false)">⬅ QUAY LẠI</button>
    </div>

    <div id="game-container">
        <div class="health-board">
            <div class="health-bar-container"><div id="hp1" class="health-fill"></div><div class="player-name-tag" id="name1">Player 1</div></div>
            <div class="health-bar-container" id="hp2-container"><div id="hp2" class="health-fill"></div><div class="player-name-tag" id="name2">BOT Cấp 1</div></div>
        </div>

        <div id="arena">
            <div id="player1" class="player"></div>
            <div id="player2" class="player"></div>
            
            <div id="game-over-screen">
                <div id="winner-text">K.O!</div>
                <p id="reward-text" style="color: #4cd137; font-size: 20px; display: none;">+50 Vàng</p>
                <button class="btn" id="btn-rematch" onclick="requestRematch()">ĐẤU LẠI</button>
                <button class="btn" style="background: #555;" onclick="location.reload()">VỀ MENU</button>
            </div>
        </div>
        <p style="margin-top: 15px;"><b>A/D</b>: Đi | <b>W</b>: Nhảy (Nhấn 2 lần Nhảy Đúp) | <b>Shift</b>: Đỡ Đòn | <b>Space</b>: Đánh/Bắn/Đặt Bom</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isBotMode = false;
        let myRole = 'p1';
        let currentRoom = null;
        let myName = "";
        
        // HỆ THỐNG TIỀN TỆ & TÚI ĐỒ (Lưu vào LocalStorage)
        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let unlocked = JSON.parse(localStorage.getItem('unlocked')) || { gun: false, bomb: false, grenade: false };
        let currentEquip = 'none';

        function updateCurrencyUI() {
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('shop-coin-count').innerText = coins;
            
            // Hiện nút mua hoặc đã mua trong Shop
            ['gun', 'bomb', 'grenade'].forEach(item => {
                if(unlocked[item]) {
                    if(document.getElementById(`buy-${item}`)) document.getElementById(`buy-${item}`).innerText = "Đã sở hữu";
                    document.getElementById(`eq-${item}`).style.display = "inline-block";
                }
            });
        }
        updateCurrencyUI();

        function toggleShop(show) {
            document.getElementById('menu-screen').style.display = show ? 'none' : 'block';
            document.getElementById('shop-screen').style.display = show ? 'block' : 'none';
        }

        function buyItem(item, price) {
            if (unlocked[item]) return alert("Bạn đã có món này rồi!");
            if (coins >= price) {
                coins -= price;
                unlocked[item] = true;
                localStorage.setItem('coins', coins);
                localStorage.setItem('unlocked', JSON.stringify(unlocked));
                updateCurrencyUI();
                checkEasterEgg(); // Refresh inventory UI
            } else {
                alert("Không đủ vàng! Đánh BOT để kiếm thêm nhé.");
            }
        }

        function equipItem(item) {
            currentEquip = item;
            document.querySelectorAll('.inv-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`eq-${item}`).classList.add('active');
        }

        // EASTER EGG NGỌC
        function checkEasterEgg() {
            let name = document.getElementById('playerNameInput').value.trim().toLowerCase();
            if (name === "ngọc" || name === "ngoc") {
                document.getElementById('inventory-ui').style.display = 'block';
                // Mở khóa tạm thời mọi thứ
                document.getElementById('eq-gun').style.display = "inline-block";
                document.getElementById('eq-bomb').style.display = "inline-block";
                document.getElementById('eq-grenade').style.display = "inline-block";
            } else if(Object.values(unlocked).some(v => v)) {
                // Mở kho đồ nếu có mua hàng thật
                document.getElementById('inventory-ui').style.display = 'block';
            } else {
                document.getElementById('inventory-ui').style.display = 'none';
            }
        }

        // --- VẬT LÝ GAME ---
        const groundY = 300; 
        const attackRange = 80;
        const baseDamage = 15;
        let entities = []; // Lưu Đạn, Lựu đạn, Bom

        let p1 = { x: 50, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0 };
        let p2 = { x: 650, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0 };
        let keys = { a: false, d: false };

        const myElement = () => document.getElementById(myRole === 'p1' ? 'player1' : 'player2');
        const oppElement = () => document.getElementById(myRole === 'p1' ? 'player2' : 'player1');
        const getMe = () => myRole === 'p1' ? p1 : p2;
        const getOpp = () => myRole === 'p1' ? p2 : p1;

        // --- KHỞI ĐỘNG GAME ---
        function initGame(mode, p1Name, p2Name) {
            isBotMode = (mode === 'bot');
            myName = p1Name;
            document.getElementById('name1').innerText = p1Name;
            document.getElementById('name2').innerText = p2Name;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            resetGameUI();
            gameLoop();
        }

        function startBotMode() {
            let name = document.getElementById('playerNameInput').value.trim();
            initGame('bot', name || "Khách", "BOT Hủy Diệt");
        }

        function startOnlineMode() {
            let name = document.getElementById('playerNameInput').value.trim();
            socket.emit('findMatch', name || "Khách");
            document.getElementById('status-text').innerText = "Đang tìm đối thủ...";
        }

        socket.on('matchFound', (data) => {
            myRole = data.role;
            currentRoom = data.roomId;
            let myN = document.getElementById('playerNameInput').value.trim() || "Khách";
            initGame('online', myRole === 'p1' ? myN : data.oppName, myRole === 'p1' ? data.oppName : myN);
        });

        // --- NHẬN DATA TỪ SERVER ---
        socket.on('updateOpponent', (oppData) => {
            let opp = getOpp();
            opp.x = oppData.x; opp.y = oppData.y; opp.isBlocking = oppData.isBlocking;
            if (opp.isBlocking) oppElement().classList.add('blocking');
            else oppElement().classList.remove('blocking');
        });

        socket.on('takeDamage', (dmg) => handleDamage(getMe(), dmg));
        socket.on('opponentShoot', (d) => spawnEntity('bullet', d.x, d.y, d.vx, 0, false));
        socket.on('opponentBomb', (d) => spawnEntity('bomb', d.x, d.y, 0, 0, false));
        socket.on('opponentGrenade', (d) => spawnEntity('grenade', d.x, d.y, d.vx, d.vy, false));

        // --- LOGIC HÀNH ĐỘNG CỦA NGƯỜI CHƠI ---
        function doAttack() {
            let me = getMe();
            if(me.isDead || me.isBlocking) return;

            myElement().classList.add('attacking');
            setTimeout(() => myElement().classList.remove('attacking'), 150);

            let dir = myRole === 'p1' ? 1 : -1; // Hướng đánh
            
            if (currentEquip === 'gun') {
                spawnEntity('bullet', me.x + 30, me.y + 40, dir * 15, 0, true);
                if(!isBotMode) socket.emit('shoot', { roomId: currentRoom, x: me.x+30, y: me.y+40, vx: dir*15 });
            } 
            else if (currentEquip === 'bomb') {
                spawnEntity('bomb', me.x + 20, groundY + 70, 0, 0, true);
                if(!isBotMode) socket.emit('throwBomb', { roomId: currentRoom, x: me.x+20, y: groundY+70 });
            }
            else if (currentEquip === 'grenade') {
                spawnEntity('grenade', me.x + 30, me.y, dir * 8, -12, true); // Bắn vòng cung lên trên
                if(!isBotMode) socket.emit('shootGrenade', { roomId: currentRoom, x: me.x+30, y: me.y, vx: dir*8, vy: -12 });
            }
            else {
                // Đấm chay
                let opp = getOpp();
                let dist = Math.abs(me.x - opp.x);
                if(dist < attackRange && Math.abs(me.y - opp.y) < 50 && !opp.isDead) {
                    if(!isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: baseDamage });
                    handleDamage(opp, baseDamage);
                }
            }
        }

        // TÍNH TOÁN SÁT THƯƠNG & ĐỠ ĐÒN (BLOCK)
        function handleDamage(target, dmg) {
            if(target.isDead) return;
            
            // Nếu đang đỡ đòn, sát thương giảm 80%
            if (target.isBlocking) {
                dmg = Math.floor(dmg * 0.2); 
            }

            target.hp -= dmg;
            
            let hpFill = target === p1 ? document.getElementById('hp1') : document.getElementById('hp2');
            hpFill.style.width = Math.max(0, target.hp) + '%';
            if(target.hp <= 30) hpFill.style.backgroundColor = '#e84118';
            else hpFill.style.backgroundColor = '#4cd137';

            if(target.hp <= 0) {
                target.isDead = true;
                (target === p1 ? document.getElementById('player1') : document.getElementById('player2')).classList.add('dead');
                
                setTimeout(() => {
                    document.getElementById('game-over-screen').style.display = 'flex';
                    let isIWon = (target === getOpp());
                    document.getElementById('winner-text').innerText = isIWon ? "BẠN ĐÃ THẮNG!" : "BẠN ĐÃ THUA!";
                    document.getElementById('winner-text').style.color = isIWon ? "#4cd137" : "#e84118";
                    
                    // Thưởng tiền nếu thắng BOT
                    if (isIWon && isBotMode) {
                        coins += 50;
                        localStorage.setItem('coins', coins);
                        updateCurrencyUI();
                        document.getElementById('reward-text').style.display = 'block';
                    } else {
                        document.getElementById('reward-text').style.display = 'none';
                    }
                }, 500);
            }
        }

        // --- QUẢN LÝ THỰC THỂ (ĐẠN, BOM, LỰU ĐẠN) ---
        function spawnEntity(type, x, y, vx, vy, isMine) {
            let el = document.createElement('div');
            el.className = type;
            document.getElementById('arena').appendChild(el);
            
            let entity = { type: type, x: x, y: y, vx: vx, vy: vy, el: el, isMine: isMine, age: 0 };
            
            if (type === 'bomb') {
                el.innerText = "3";
                entity.timer = 3;
                let countdown = setInterval(() => {
                    entity.timer--;
                    if(el) el.innerText = entity.timer;
                    if(entity.timer <= 0) clearInterval(countdown);
                }, 1000);
            }
            entities.push(entity);
        }

        function updateEntities() {
            for(let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.age++;

                // Vật lý
                if (e.type === 'bullet') {
                    e.x += e.vx;
                } else if (e.type === 'grenade') {
                    e.x += e.vx;
                    e.y += e.vy;
                    e.vy += 0.8; // Trọng lực của lựu đạn
                }

                e.el.style.left = e.x + 'px';
                e.el.style.top = e.y + 'px';

                // Xử lý nổ/va chạm
                let target = e.isMine ? getOpp() : getMe();

                if (e.type === 'bomb') {
                    if (e.age > 180) { // Nổ sau 3 giây (60fps * 3 = 180 frames)
                        e.el.className = 'bomb-explode';
                        e.el.innerText = "";
                        // Tính sát thương AoE (bán kính nổ 80px)
                        if (Math.abs(e.x - target.x) < 80 && Math.abs(e.y - target.y) < 80) {
                            if (e.isMine && !isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: 30 });
                            if (e.isMine) handleDamage(target, 30);
                        }
                        // Xóa bom sau 0.5s hiển thị nổ
                        setTimeout(() => { if(e.el && e.el.parentNode) e.el.remove(); }, 300);
                        entities.splice(i, 1);
                    }
                } 
                else {
                    // Check Hitbox Đạn & Lựu Đạn
                    if (e.x > target.x && e.x < target.x + 60 && e.y > target.y && e.y < target.y + 90 && !target.isDead) {
                        let dmg = e.type === 'grenade' ? 25 : 10;
                        if (e.isMine) {
                            if (!isBotMode) socket.emit('playerHit', { roomId: currentRoom, damage: dmg });
                            handleDamage(target, dmg);
                        }
                        e.el.remove(); entities.splice(i, 1); continue;
                    }

                    // Chạm đất (Lựu đạn) hoặc bay ra ngoài
                    if ((e.type === 'grenade' && e.y > groundY + 70) || e.x < 0 || e.x > 800) {
                        e.el.remove(); entities.splice(i, 1);
                    }
                }
            }
        }

        // --- BOT AI (Đã GIẢM ĐỘ KHÓ) ---
        let botWait = 0; // Thời gian nghỉ của BOT
        function runBotAI() {
            let bot = p2; let player = p1;
            if(bot.isDead || player.isDead) return;

            // Chặn đạn nếu thấy đạn bay tới gần
            let bulletNear = entities.some(e => e.isMine && Math.abs(e.x - bot.x) < 150);
            if (bulletNear && Math.random() < 0.5) { // 50% cơ hội đỡ đạn
                bot.isBlocking = true;
                return; // Ngừng di chuyển để đỡ
            } else {
                bot.isBlocking = false;
            }

            let dist = bot.x - player.x;
            botWait--;

            if (botWait > 0) return; // Nếu đang trong thời gian nghỉ thì đứng im

            if (dist > 80) bot.x -= 3; // Giảm tốc độ BOT (trước là 5)
            else if (dist < -80) bot.x += 3;
            else {
                if (Math.random() < 0.03) { // Giảm tỷ lệ đánh (trước là 0.08)
                    document.getElementById('player2').classList.add('attacking');
                    setTimeout(() => document.getElementById('player2').classList.remove('attacking'), 150);
                    handleDamage(player, baseDamage);
                    botWait = 60; // Đánh xong nghỉ 1 giây (60 frames)
                }
            }
        }

        // --- BÀN PHÍM ---
        window.addEventListener('keydown', (e) => {
            let me = getMe();
            if(me.isDead) return;

            if(e.key === 'a' || e.key === 'A') keys.a = true;
            if(e.key === 'd' || e.key === 'D') keys.d = true;
            
            // NHẢY ĐÚP (DOUBLE JUMP)
            if(e.key === 'w' || e.key === 'W') {
                if(me.y >= groundY) {
                    me.vy = -15; me.jumpCount = 1;
                } else if (me.jumpCount === 1) {
                    me.vy = -12; me.jumpCount = 2; // Nhảy thêm cái nữa trên không
                }
            }

            // ĐỠ ĐÒN (BLOCK)
            if(e.key === 'Shift') {
                me.isBlocking = true;
                myElement().classList.add('blocking');
            }

            if(e.code === 'Space' && !e.repeat) doAttack();
        });

        window.addEventListener('keyup', (e) => {
            let me = getMe();
            if(e.key === 'a' || e.key === 'A') keys.a = false;
            if(e.key === 'd' || e.key === 'D') keys.d = false;
            
            // THẢ ĐỠ ĐÒN
            if(e.key === 'Shift') {
                me.isBlocking = false;
                myElement().classList.remove('blocking');
            }
        });

        function resetGameUI() {
            document.getElementById('game-over-screen').style.display = 'none';
            p1 = { x: 50, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0 };
            p2 = { x: 650, y: groundY, vy: 0, hp: 100, isDead: false, isBlocking: false, jumpCount: 0 };
            entities.forEach(e => e.el.remove()); entities = [];
            document.getElementById('player1').className = 'player';
            document.getElementById('player2').className = 'player';
            document.getElementById('hp1').style.width = '100%'; document.getElementById('hp1').style.backgroundColor = '#4cd137';
            document.getElementById('hp2').style.width = '100%'; document.getElementById('hp2').style.backgroundColor = '#4cd137';
        }

        // --- ĐẤU LẠI ONLINE ---
        socket.on('rematchOffer', () => { document.getElementById('btn-rematch').innerText = "Đối thủ rủ đấu lại! Bấm để đồng ý"; document.getElementById('btn-rematch').style.background = "#4cd137"; });
        socket.on('rematchStart', () => resetGameUI());

        function requestRematch() {
            if (isBotMode) resetGameUI();
            else {
                document.getElementById('btn-rematch').innerText = "Đang chờ đối thủ đồng ý...";
                socket.emit('rematchRequest', currentRoom);
            }
        }

        // --- VÒNG LẶP CHÍNH ---
        function gameLoop() {
            let me = getMe();

            if (!p1.isDead && !p2.isDead) {
                if(isBotMode) runBotAI();

                // Di chuyển (Bị chậm đi nếu đang đỡ đòn)
                let speed = me.isBlocking ? 2 : 6;
                if(keys.a) me.x = Math.max(0, me.x - speed);
                if(keys.d) me.x = Math.min(800 - 60, me.x + speed);

                // Vật lý Nhảy/Rơi
                me.y += me.vy;
                if (me.y < groundY) {
                    me.vy += 0.8; // Lực hút trái đất
                } else {
                    me.y = groundY; 
                    me.vy = 0;
                    me.jumpCount = 0; // Chạm đất reset số lần nhảy đúp
                }

                if(!isBotMode) {
                    socket.emit('playerAction', {
                        roomId: currentRoom,
                        playerData: { x: me.x, y: me.y, isBlocking: me.isBlocking }
                    });
                }
            }

            document.getElementById('player1').style.left = p1.x + 'px'; document.getElementById('player1').style.top = p1.y + 'px';
            document.getElementById('player2').style.left = p2.x + 'px'; document.getElementById('player2').style.top = p2.y + 'px';

            updateEntities();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
