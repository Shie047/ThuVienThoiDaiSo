<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Đối Kháng - Bản Cập Nhật Kỷ Nguyên Mới</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', sans-serif; margin: 0; padding-top: 15px; user-select: none; overflow: hidden; }
        
        .panel { background: rgba(11, 12, 16, 0.95); padding: 25px; border-radius: 12px; border: 2px solid #45a29e; text-align: center; width: 450px; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 20px rgba(69, 162, 158, 0.2); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #45a29e; border-radius: 10px; }
        
        .input-name { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #45a29e; background: #1f2833; color: #66fcf1; margin-bottom: 15px; width: 80%; text-align: center; font-weight: bold;}
        .btn { background: #1f2833; color: #66fcf1; border: 1px solid #45a29e; padding: 12px; font-size: 14px; cursor: pointer; border-radius: 6px; font-weight: bold; margin: 4px; transition: 0.2s; width: 80%; text-transform: uppercase; letter-spacing: 1px;}
        .btn:hover { background: #45a29e; color: #0b0c10; }
        .btn-boss { border-color: #d9534f; color: #d9534f; } .btn-boss:hover { background: #d9534f; color: #fff;}
        .btn-world { border-color: #f1c40f; color: #f1c40f; text-shadow: 0 0 5px #f1c40f; } .btn-world:hover { background: #f1c40f; color: #000; }
        .btn-equip { width: auto; padding: 5px 10px; font-size: 12px; border: none; margin: 2px;} .btn-equip.active { background: #66fcf1; color: #0b0c10; box-shadow: 0 0 10px #66fcf1; }
        
        .stats-bar { display: flex; justify-content: space-around; font-size: 18px; color: #f1c40f; font-weight: bold; margin-bottom: 10px; }
        .shop-item { display: flex; justify-content: space-between; background: #1f2833; padding: 10px; margin: 5px 0; border-radius: 5px; align-items: center; font-size: 14px;}

        /* GAME UI */
        #game-container { display: none; flex-direction: column; align-items: center; }
        .map-info { font-size: 18px; color: #66fcf1; font-weight: bold; margin-bottom: 5px; text-shadow: 0 0 5px #45a29e; text-transform: uppercase; letter-spacing: 2px;}
        .health-board { display: flex; justify-content: space-between; width: 800px; margin-bottom: 5px; }
        .health-bar-container { width: 45%; background-color: #111; height: 25px; border: 2px solid #45a29e; border-radius: 4px; position: relative; }
        .health-fill { height: 100%; background: #66fcf1; width: 100%; transition: width 0.1s ease-out; }
        .player-name-tag { position: absolute; top: 2px; left: 10px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black; color: white;}
        #hp2-container { display: flex; justify-content: flex-end; } #hp2-container .player-name-tag { left: auto; right: 10px; }
        .boss-hp { background: #d9534f !important; }

        /* SÀN ĐẤU & MAPS */
        #arena { width: 800px; height: 400px; background-color: #1e272e; position: relative; border: 4px solid #45a29e; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: background 0.5s; }
        .player { width: 60px; height: 90px; position: absolute; background-color: #66fcf1; border-radius: 8px; z-index: 5; transition: filter 0.2s; }
        #player2 { background-color: #d9534f; }
        .teammate { background-color: #f39c12; opacity: 0.8; }
        
        .blocking { box-shadow: 0 0 15px 5px #fff; border: 2px solid #fff; } #player2.blocking { box-shadow: 0 0 15px 5px #d9534f; }
        .attacking { filter: brightness(2); transform: scale(1.05); }
        .boss-telegraph { filter: brightness(4) drop-shadow(0 0 25px red) !important; background-color: white !important; }
        .dead { transform: rotate(-90deg) translateY(30px) !important; filter: grayscale(100%); opacity: 0.5; }
        .stunned { filter: sepia(100%) hue-rotate(50deg) saturate(300%) !important; box-shadow: 0 0 15px #00b894; }

        /* MÀU SẮC ĐẶC TRƯNG CỦA BOSS */
        .boss-titan { background: #7f8fa6 !important; border: 3px solid #2f3640; box-shadow: inset 0 0 10px #000; width: 70px !important; height: 100px !important;}
        .boss-zephyr { background: #00b894 !important; box-shadow: 0 0 20px #00b894; }
        .boss-ifrit { background: #d9534f !important; box-shadow: 0 0 30px #ff7675; }
        .boss-shadow { background: #111 !important; border: 1px solid #8e44ad; opacity: 0.85; }
        .boss-omega { background: linear-gradient(135deg, #f1c40f, #fff) !important; box-shadow: 0 0 40px #f1c40f; }
        .boss-abyss { background: #000 !important; border: 2px solid #d9534f; box-shadow: 0 0 50px #d9534f; width: 100px !important; height: 120px !important; }

        /* VẬT LÝ & VFX MỚI */
        .slash-arc { position: absolute; width: 100px; height: 100px; border-right: 10px solid white; border-radius: 50%; opacity: 0; transform: translateY(-20px); z-index: 10; }
        .bomb-explode { width: 160px; height: 160px; background: radial-gradient(circle, #fbc531, #e84118, transparent); border-radius: 50%; position: absolute; transform: translate(-80px, -80px); opacity: 0.9; z-index: 10; }
        .shockwave { width: 800px; height: 40px; background: linear-gradient(to top, rgba(217, 83, 79, 0.8), transparent); position: absolute; bottom: 0; left: 0; opacity: 0.7; }
        
        .bullet { position: absolute; width: 18px; height: 6px; background: #f1c40f; border-radius: 3px; }
        .bomb { position: absolute; width: 22px; height: 22px; background: #222; border: 2px solid #d9534f; border-radius: 50%; color: white; font-size: 11px; display: flex; justify-content: center; align-items: center; }
        .grenade { position: absolute; width: 14px; height: 14px; background: #45a29e; border-radius: 50%; }
        @keyframes spin { 100% { transform: rotate(360deg); } } 
        .shuriken { width: 24px; height: 24px; background: #ccc; clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%); animation: spin 0.1s linear infinite; position: absolute; }
        .shotgun_bullet { position: absolute; width: 8px; height: 8px; background: #e67e22; border-radius: 50%; }
        .sniper_bullet { position: absolute; width: 40px; height: 3px; background: #fff; box-shadow: 0 0 10px #fff; }
        .fireball { position: absolute; width: 35px; height: 35px; background: radial-gradient(circle, #fff, #f1c40f, #d9534f); border-radius: 50%; box-shadow: 0 0 15px #d9534f; }
        .rocket { position: absolute; width: 30px; height: 12px; background: #555; border-right: 8px solid #d9534f; }
        .laser { position: absolute; width: 150px; height: 8px; background: #66fcf1; box-shadow: 0 0 15px #66fcf1; }
        
        /* 5 VŨ KHÍ MỚI */
        .shield_aura { position: absolute; width: 100px; height: 100px; border: 3px solid #3498db; border-radius: 50%; transform: translate(-20px, -5px); opacity: 0.6; box-shadow: 0 0 10px #3498db; }
        .holy_shield_aura { position: absolute; width: 120px; height: 120px; border: 4px solid #f1c40f; border-radius: 50%; transform: translate(-30px, -15px); opacity: 0.8; box-shadow: 0 0 20px #f1c40f, inset 0 0 10px #f1c40f; }
        .holy_light { position: absolute; width: 25px; height: 25px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #f1c40f; }
        .vine { position: absolute; width: 40px; height: 10px; background: #27ae60; border-radius: 5px; box-shadow: 0 0 5px #2ecc71; border: 1px dashed #1e8449; }
        .horse_charge { position: absolute; width: 80px; height: 60px; background: rgba(139, 69, 19, 0.8); border-radius: 10px; box-shadow: 0 0 20px #8B4513; border-right: 5px solid #fff; }

        .fire_wave { position: absolute; width: 50px; height: 120px; background: linear-gradient(to right, transparent, #d9534f); clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 80%); }
        .void_scythe { position: absolute; width: 45px; height: 45px; border: 5px solid transparent; border-top: 5px solid #8e44ad; border-right: 5px solid #8e44ad; border-radius: 50%; animation: spin 0.1s linear infinite; }
        .omega_beam { position: absolute; width: 800px; height: 50px; background: rgba(255,255,255,0.9); box-shadow: 0 0 20px #f1c40f, 0 0 40px #d9534f; z-index: 1; }

        #game-over-screen, #waiting-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,12,16,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #winner-text, .wait-title { font-size: 40px; color: #f1c40f; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>

    <div id="menu-screen" class="panel">
        <h1 style="color: #66fcf1; margin-top: 0;">Chiến Trường Số</h1>
        <div class="stats-bar"><span>Vàng: <span id="coin-count">0</span></span> <span style="color: #e74c3c;">Tim: <span id="heart-count">0</span></span></div>
        <input type="text" id="playerNameInput" class="input-name" placeholder="Tên của bạn (VIP: Ngọc)">
        
        <div id="inventory-ui" style="text-align: left; margin: 10px 0; padding: 10px; background: #111; border-radius: 8px;">
            <h4 style="margin: 0 0 5px 0; color: #45a29e;">TRANG BỊ ĐANG MANG</h4>
            <div id="inventory-list"></div>
        </div>
        
        <button class="btn" style="background:#2ecc71; color:#000;" onclick="startBotMode('normal')">Luyện Tập Cơ Bản</button>
        <button class="btn" onclick="startOnlineMode()">Đấu Trường 1v1</button>
        <button class="btn btn-boss" onclick="toggleBossMenu(true)">Hầm Ngục (Khó Điên Rồ)</button>
        <button class="btn btn-world" onclick="showWorldBossLobby()">Đánh Boss Thế Giới (Co-op)</button>
        <button class="btn" style="background:#111; border-color:#fff" onclick="toggleShop(true)">Cửa Hàng Vũ Khí</button>
    </div>

    <div id="boss-screen" class="panel" style="display: none;">
        <h2 style="color: #d9534f;">LÃNH CHÚA VỰC THẲM </h2>
        <p style="font-size: 13px; color: #ccc;">Boss cực mạnh</p>
        <button class="btn" onclick="startBotMode('titan')">TITAN (Vua Thép)</button>
        <button class="btn" onclick="startBotMode('zephyr')">ZEPHYR (Cuồng Phong)</button>
        <button class="btn" onclick="startBotMode('ifrit')">IFRIT (Hỏa Thần)</button>
        <button class="btn" onclick="startBotMode('shadow')">SHADOW (Bí Ẩn Của Bóng Tối)</button>
        <button class="btn" style="border-color:#f1c40f; color:#f1c40f;" onclick="startBotMode('omega')">OMEGA (Kẻ Diệt Thế)</button>
        <button class="btn" style="background: #111; margin-top:10px;" onclick="toggleBossMenu(false)">Trở Về</button>
    </div>

    <div id="waiting-screen" class="panel" style="display: none;">
        <h2 class="wait-title" id="wait-msg">ĐANG TÌM ĐỐI THỦ...</h2>
        <div class="loader" style="border: 5px solid #111; border-top: 5px solid #66fcf1; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto;"></div>
        <button class="btn btn-world" id="btn-start-early" style="display:none;" onclick="startWorldBossEarly()">VÀO ĐÁNH LUÔN</button>
        <button class="btn" style="background: #111; margin-top: 20px;" onclick="cancelMatchmaking()">HỦY & TRỞ VỀ</button>
    </div>

    <div id="shop-screen" class="panel" style="display: none;">
        <h2 style="color: #66fcf1; margin-top: 0;">TIỆM RÈN KHÍ TÀI</h2>
        <div class="stats-bar">Vàng: <span id="shop-coin-count">0</span></div>
        <div id="shop-list"></div>
        <button class="btn" style="background: #111; margin-top: 15px;" onclick="toggleShop(false)">Quay lại</button>
    </div>

    <div id="game-container">
        <div class="map-info" id="map-name-display">MAP: ĐẤU TRƯỜNG CỔ ĐẠI</div>
        <div class="health-board">
            <div class="health-bar-container"><div id="hp1" class="health-fill"></div><div class="player-name-tag" id="name1">Player 1</div></div>
            <div class="health-bar-container" id="hp2-container"><div id="hp2" class="health-fill"></div><div class="player-name-tag" id="name2">Địch</div></div>
        </div>

        <div id="arena">
            <div id="player1" class="player"></div>
            <div id="player2" class="player"></div>
            <div id="teammates-container"></div>
            
            <div id="game-over-screen-inner" style="position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:100;">
                <div id="winner-text" style="font-size: 45px; color: #d9534f; margin-bottom: 10px; font-weight: bold;">BẠN ĐÃ CHẾT</div>
                <p id="reward-text" style="color: #f1c40f; font-size: 20px; font-weight: bold; display: none;">+ Chiến Lợi Phẩm!</p>
                <button class="btn" id="btn-rematch-boss" style="background:#e67e22; display:none;" onclick="startBotMode(currentBoss)">ĐÁNH LẠI BOSS</button>
                <button class="btn" id="btn-rematch-pvp" style="background:#2ecc71; display:none;" onclick="requestRematchPvP()">ĐẤU LẠI 1VS1</button>
                <button class="btn" style="background:#1f2833;" onclick="location.reload()">HỒI SINH (VỀ MENU)</button>
            </div>
        </div>
        <div style="background: rgba(0,0,0,0.8); padding: 5px; border-radius: 8px; margin-top: 10px; font-size: 13px; text-align: center; border: 1px solid #45a29e;">
            <b style="color:#f1c40f">HP: 200</b> | <span style="color:#66fcf1">A/D: Đi</span> | <span style="color:#f1c40f">W: Nhảy đúp</span> | <span style="color:#4cd137">Shift: Đỡ </span> | <span style="color:#d9534f">Space: Đánh/Kỹ Năng</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let gameMode = ''; 
        let currentBoss = 'normal'; 
        let myRole = 'p1';
        let currentRoom = null;
        let teammates = {}; 
        
        const maps = [
            { name: "Núi Lửa", bg: "linear-gradient(to bottom, #4a0e0e 0%, #1a0505 100%)", buff: "energy" },
            { name: "Tương Lai", bg: "linear-gradient(to bottom, #001f3f 0%, #000 100%)", buff: "piercing" },
            { name: "Doanh Trại", bg: "linear-gradient(to bottom, #2b3a2a 0%, #1a1a1a 100%)", buff: "ballistic" },
            { name: "Phế Tích", bg: "linear-gradient(to bottom, #3b3b3b 0%, #111 100%)", buff: "melee" },
            { name: "Vũ Trụ", bg: "linear-gradient(to bottom, #190033 0%, #000 100%)", buff: "explosive" }
        ];
        let currentMapBuff = '';

        // --- MỞ RỘNG VŨ KHÍ (CÓ 5 MÓN MỚI) ---
        const weapons = {
            shield: { name: 'Khiên Thường (Phòng thủ)', price: 100, type: 'defense' },
            gun: { name: 'Súng Lục', price: 150, type: 'ballistic' }, 
            katana: { name: 'Kiếm Katana', price: 200, type: 'melee' },
            bomb: { name: 'Mìn Hẹn Giờ', price: 250, type: 'explosive' }, 
            shuriken: { name: 'Phi Tiêu', price: 300, type: 'ballistic' },
            vine_spell: { name: 'Phép Dây Leo (Trói chân)', price: 400, type: 'magic' },
            shotgun: { name: 'Hoa Cải', price: 450, type: 'ballistic' }, 
            grenade: { name: 'Phóng Lựu', price: 500, type: 'explosive' },
            holy_shield: { name: 'Khiên Thánh (Phản đòn)', price: 700, type: 'defense' },
            sniper: { name: 'Súng Ngắm', price: 750, type: 'piercing' }, 
            holy_staff: { name: 'Trượng Thánh (Phép xuyên)', price: 900, type: 'energy' },
            fireball: { name: 'Cầu Lửa', price: 950, type: 'energy' },
            rocket: { name: 'Bazooka', price: 1100, type: 'explosive' }, 
            horse: { name: 'Ngựa Chiến (Gọi thú cưỡi)', price: 1200, type: 'melee' },
            laser: { name: 'Súng Laser', price: 1500, type: 'energy' }
        };
        const ultimates = {
            dragon_blade: { name: '[VIP] Kiếm Rồng', drop: 'ifrit', type: 'energy' },
            gravity_hammer: { name: '[VIP] Búa Trọng Lực', drop: 'titan', type: 'explosive' },
            storm_bow: { name: '[VIP] Cung Bão Tố', drop: 'zephyr', type: 'ballistic' },
            void_scythe: { name: '[VIP] Lưỡi Hái Hư Không', drop: 'shadow', type: 'piercing' },
            omega_beam: { name: '[MAX] TIA OMEGA', drop: 'omega', type: 'energy' }
        };

        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let hearts = parseInt(localStorage.getItem('hearts')) || 0;
        let unlocked = JSON.parse(localStorage.getItem('unlocked')) || {};
        let currentEquip = localStorage.getItem('currentEquip') || 'none';
        document.getElementById('playerNameInput').value = localStorage.getItem('playerName') || '';

        document.getElementById('playerNameInput').addEventListener('input', function() {
            localStorage.setItem('playerName', this.value.trim()); checkEasterEgg();
        });

        function renderShopAndInventory() {
            let shopHtml = ''; let invHtml = '<button class="btn btn-equip" id="eq-none" onclick="equipItem(\'none\')">Tay Không</button> ';
            for(let key in weapons) {
                let isOwned = unlocked[key];
                shopHtml += `<div class="shop-item"><span>${weapons[key].name} - <b>${weapons[key].price} V</b></span> 
                             <button class="btn btn-equip" style="background: ${isOwned ? '#333' : '#45a29e'}" onclick="buyItem('${key}', ${weapons[key].price})">${isOwned ? 'Đã có' : 'Mua'}</button></div>`;
                if(isOwned) invHtml += `<button class="btn btn-equip" onclick="equipItem('${key}')" id="eq-${key}">${weapons[key].name}</button> `;
            }
            for(let key in ultimates) { if (unlocked[key]) invHtml += `<button class="btn btn-equip" style="color:#f1c40f; border-color:#f1c40f;" onclick="equipItem('${key}')" id="eq-${key}">${ultimates[key].name}</button> `; }
            
            document.getElementById('shop-list').innerHTML = shopHtml; document.getElementById('inventory-list').innerHTML = invHtml;
            document.getElementById('coin-count').innerText = coins; document.getElementById('heart-count').innerText = hearts;
            document.getElementById('shop-coin-count').innerText = coins;
            equipItem(currentEquip); checkEasterEgg();
        }

        function toggleShop(show) { document.querySelectorAll('.panel').forEach(p=>p.style.display='none'); document.getElementById(show?'shop-screen':'menu-screen').style.display = 'block'; }
        function toggleBossMenu(show) { document.querySelectorAll('.panel').forEach(p=>p.style.display='none'); document.getElementById(show?'boss-screen':'menu-screen').style.display = 'block'; }

        function buyItem(item, price) {
            if (unlocked[item]) return;
            if (coins >= price) { coins -= price; unlocked[item] = true; localStorage.setItem('coins', coins); localStorage.setItem('unlocked', JSON.stringify(unlocked)); renderShopAndInventory(); } 
            else alert("Chưa đủ Vàng, hãy đánh Boss để cày thêm!");
        }

        function equipItem(item) {
            currentEquip = item; localStorage.setItem('currentEquip', item);
            document.querySelectorAll('.btn-equip').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById(`eq-${item}`)) document.getElementById(`eq-${item}`).classList.add('active');
        }
        function unlockItem(item) { unlocked[item] = true; localStorage.setItem('unlocked', JSON.stringify(unlocked)); renderShopAndInventory(); }
        function checkEasterEgg() {
            let name = document.getElementById('playerNameInput').value.trim().toLowerCase();
            if (name === "ngọc" || name === "ngoc") {
                for(let key in weapons) if(document.getElementById(`eq-${key}`)) document.getElementById(`eq-${key}`).style.display = 'inline-block';
                for(let key in ultimates) if(document.getElementById(`eq-${key}`)) document.getElementById(`eq-${key}`).style.display = 'inline-block';
            }
        }
        renderShopAndInventory();

        // --- CORE GAME ---
        const groundY = 290; let entities = []; 
        let p1 = { x: 50, y: groundY, vy: 0, hp: 200, maxHp: 200, isDead: false, isBlocking: false, jumpCount: 0, facingDir: 1, stunTimer: 0 };
        let p2 = { x: 650, y: groundY, vy: 0, hp: 200, maxHp: 200, isDead: false, isBlocking: false, jumpCount: 0, facingDir: -1, stunTimer: 0 };
        let keys = { a: false, d: false };

        const myElement = () => document.getElementById('player1'); const oppElement = () => document.getElementById('player2');
        const getMe = () => p1; const getOpp = () => p2;

        function setMap(mapIndex) {
            let map = maps[mapIndex]; currentMapBuff = map.buff;
            document.getElementById('map-name-display').innerText = `MAP: ${map.name} (Buff Lớp: ${map.buff})`;
            document.getElementById('arena').style.background = map.bg;
        }

        function initGame(mode, p1Name, p2Name) {
            gameMode = mode;
            document.getElementById('name1').innerText = p1Name; document.getElementById('name2').innerText = p2Name;
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none'); 
            document.getElementById('game-container').style.display = 'flex';
            resetGameUI(); gameLoop();
        }

        // --- XỬ LÝ MÀN HÌNH CHỜ & GHÉP TRẬN ---
        function showWaitingScreen(msg, showStartBtn = false) {
            document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
            document.getElementById('waiting-screen').style.display = 'flex';
            document.getElementById('wait-msg').innerText = msg;
            document.getElementById('btn-start-early').style.display = showStartBtn ? 'block' : 'none';
        }

        function cancelMatchmaking() {
            socket.emit('cancelMatch'); socket.emit('leaveWorldBossLobby');
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        // --- ONLINE 1V1 ---
        function startOnlineMode() { socket.emit('findMatch', document.getElementById('playerNameInput').value || "Người Chơi"); showWaitingScreen("ĐANG TÌM ĐỐI THỦ 1VS1..."); }
        socket.on('waiting_1v1', () => showWaitingScreen("ĐANG TÌM ĐỐI THỦ 1VS1..."));
        socket.on('matchFound', (data) => {
            myRole = data.role; currentRoom = data.roomId;
            let myN = document.getElementById('playerNameInput').value || "Người Chơi";
            setMap(data.mapId);
            initGame('online', myRole === 'p1' ? myN : data.oppName, myRole === 'p1' ? data.oppName : myN);
            document.getElementById('hp2').classList.remove('boss-hp');
            document.getElementById('player2').className = 'player'; // Xóa CSS Boss
        });

        // --- HÀNH ĐỘNG CỦA NGƯỜI CHƠI ---
        function doAttack() {
            let me = getMe(); if(me.isDead || me.stunTimer > 0) return;
            myElement().classList.add('attacking'); setTimeout(() => myElement().classList.remove('attacking'), 200);

            let dir = me.facingDir; let px = me.x + 30; let py = me.y + 40;

            // XỬ LÝ VŨ KHÍ MỚI
            if (currentEquip === 'shield') { spawnAndSend('shield_aura', me.x, me.y, 0, 0); me.isBlocking = true; setTimeout(()=>me.isBlocking=false, 500); }
            else if (currentEquip === 'holy_shield') { spawnAndSend('holy_shield_aura', me.x, me.y, 0, 0); me.hp = Math.min(me.maxHp, me.hp + 20); me.isBlocking = true; setTimeout(()=>me.isBlocking=false, 800); }
            else if (currentEquip === 'holy_staff') spawnAndSend('holy_light', px, py, dir*20, 0);
            else if (currentEquip === 'horse') spawnAndSend('horse_charge', px, me.y+30, dir*25, 0);
            else if (currentEquip === 'vine_spell') spawnAndSend('vine', px, py, dir*18, 0);
            // VŨ KHÍ CŨ & TỐI THƯỢNG
            else if (currentEquip === 'dragon_blade') { createSlashVFX(me.x, me.y, dir); spawnAndSend('fire_wave', px, me.y, dir*12, 0); } 
            else if (currentEquip === 'gravity_hammer') { createSlashVFX(me.x, me.y, dir); spawnAndSend('shockwave', 0, groundY+70, 0, 0); } 
            else if (currentEquip === 'storm_bow') { spawnAndSend('shuriken', px, py, dir*20, -1); spawnAndSend('shuriken', px, py, dir*20, 0); spawnAndSend('shuriken', px, py, dir*20, 1); } 
            else if (currentEquip === 'void_scythe') { spawnAndSend('void_scythe', px, py, dir*12, 0); } 
            else if (currentEquip === 'omega_beam') { spawnAndSend('omega_beam', dir===1 ? px : px-800, py-20, 0, 0); }
            else if (currentEquip === 'none' || currentEquip === 'katana') {
                createSlashVFX(me.x, me.y, dir); let dmg = currentEquip === 'katana' ? 25 : 15; let range = currentEquip === 'katana' ? 120 : 70;
                if(currentMapBuff === 'melee') dmg = Math.floor(dmg * 1.3); 
                let opp = getOpp(); let isFacing = (dir === 1 && opp.x > me.x) || (dir === -1 && opp.x < me.x);
                if(Math.abs(me.x - opp.x) < range && Math.abs(me.y - opp.y) < 60 && !opp.isDead && isFacing) {
                    if(gameMode === 'online') socket.emit('playerHit', { roomId: currentRoom, damage: dmg }); else if(gameMode === 'coop') socket.emit('hitWorldBoss', dmg);
                    handleDamage(opp, dmg, 'melee', true);
                }
            } 
            else if (currentEquip === 'gun') spawnAndSend('bullet', px, py, dir*16, 0);
            else if (currentEquip === 'shuriken') spawnAndSend('shuriken', px, py, dir*22, 0);
            else if (currentEquip === 'sniper') spawnAndSend('sniper_bullet', px, py, dir*35, 0); 
            else if (currentEquip === 'laser') spawnAndSend('laser', px, py, dir*25, 0);
            else if (currentEquip === 'fireball') spawnAndSend('fireball', px, py-10, dir*8, 0); 
            else if (currentEquip === 'rocket') spawnAndSend('rocket', px, py, dir*12, 0);
            else if (currentEquip === 'shotgun') { spawnAndSend('shotgun_bullet', px, py, dir*15, -3); spawnAndSend('shotgun_bullet', px, py, dir*15, 0); spawnAndSend('shotgun_bullet', px, py, dir*15, 3); }
            else if (currentEquip === 'bomb') spawnAndSend('bomb', px-10, groundY+70, 0, 0);
            else if (currentEquip === 'grenade') spawnAndSend('grenade', px, me.y, dir*10, -12); 
        }

        function spawnAndSend(type, x, y, vx, vy) {
            spawnEntity(type, x, y, vx, vy, true);
            if (gameMode === 'online') socket.emit('shoot', { roomId: currentRoom, type: type, x: x, y: y, vx: vx, vy: vy });

        function handleStun(target, frames) {
            if(target.isDead) return;
            target.stunTimer = frames;
            let el = target === p1 ? document.getElementById('player1') : document.getElementById('player2');
            el.classList.add('stunned');
            setTimeout(() => { if(target.stunTimer <= 0) el.classList.remove('stunned'); }, (frames/60)*1000);
        }

        function handleDamage(target, dmg, type, isMeAttacking) {
            if(target.isDead) return;
            let isBoss = (gameMode === 'bot' || gameMode === 'coop') && target === p2; let actualDmg = dmg;

            if (isMeAttacking && !isBoss && target === p2 && currentMapBuff !== '') { if (type.includes(currentMapBuff)) actualDmg = Math.floor(actualDmg * 1.3); }

            if (target.isBlocking && !isBoss) {
                if(type.includes('explosive') || type.includes('piercing')) actualDmg = Math.floor(actualDmg * 0.5); else actualDmg = Math.floor(actualDmg * 0.1); 
            }

            if (isBoss && gameMode === 'bot') {
                if (currentBoss === 'titan') { if(type.includes('explosive')) actualDmg *= 1.5; else actualDmg *= 0.3; } 
                else if (currentBoss === 'zephyr') { if(type.includes('melee') || type.includes('magic')) actualDmg *= 1.5; }
                else if (currentBoss === 'shadow') { if(type.includes('energy')) actualDmg *= 1.5; else actualDmg *= 0.5;}
            }

            target.hp -= actualDmg;
            if (target === p2) updateBossHpUI();
            else {
                let hpFill = document.getElementById('hp1'); hpFill.style.width = Math.max(0, (target.hp / target.maxHp) * 100) + '%';
                if(target.hp <= target.maxHp * 0.3) hpFill.style.background = '#d9534f'; 
            }

            if(target.hp <= 0 && target === p1) {
                target.isDead = true; document.getElementById('player1').classList.add('dead');
                setTimeout(() => {
                    document.getElementById('game-over-screen-inner').style.display = 'flex';
                    document.getElementById('winner-text').innerText = "BẠN ĐÃ CHẾT";
                    document.getElementById('winner-text').style.color = "#d9534f";
                    document.getElementById('btn-rematch-boss').style.display = gameMode === 'bot' ? 'block' : 'none';
                    document.getElementById('btn-rematch-pvp').style.display = gameMode === 'online' ? 'block' : 'none';
                }, 800);
            } else if (target.hp <= 0 && target === p2 && gameMode === 'bot') {
                target.isDead = true; document.getElementById('player2').classList.add('dead');
                setTimeout(() => {
                    document.getElementById('game-over-screen-inner').style.display = 'flex';
                    document.getElementById('winner-text').innerText = "KẺ ĐỊCH BỊ TIÊU DIỆT";
                    document.getElementById('winner-text').style.color = "#f1c40f";
                    
                    if (currentBoss === 'normal') { coins += 100; document.getElementById('reward-text').innerText = "+100 Vàng"; }
                    else { 
                        coins += 800; document.getElementById('reward-text').innerText = "+800 Vàng & Tối Thượng!";
                        if(currentBoss === 'titan') unlockItem('gravity_hammer'); if(currentBoss === 'zephyr') unlockItem('storm_bow');
                        if(currentBoss === 'ifrit') unlockItem('dragon_blade'); if(currentBoss === 'shadow') unlockItem('void_scythe');
                        if(currentBoss === 'omega') unlockItem('omega_beam');
                    }
                    localStorage.setItem('coins', coins); renderShopAndInventory(); document.getElementById('reward-text').style.display = 'block';
                    document.getElementById('btn-rematch-boss').style.display = 'block';
                }, 800);
            }
        }

        function updateBossHpUI() { document.getElementById('hp2').style.width = Math.max(0, (p2.hp / p2.maxHp) * 100) + '%'; }

        function spawnEntity(type, x, y, vx, vy, isMine) {
            let el = document.createElement('div'); el.className = type; document.getElementById('arena').appendChild(el);
            let entity = { type: type, x: x, y: y, vx: vx, vy: vy, el: el, isMine: isMine, age: 0 };
            if (type === 'bomb') { el.innerText = "3"; entity.timer = 3; let cd = setInterval(() => { entity.timer--; if(el) el.innerText = entity.timer; if(entity.timer <= 0) clearInterval(cd); }, 1000); }
            entities.push(entity);
        }

        function updateEntities() {
            for(let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i]; e.age++;

                // AURA THEO NGƯỜI
                if(e.type === 'shield_aura' || e.type === 'holy_shield_aura') {
                    let owner = e.isMine ? getMe() : getOpp();
                    e.x = owner.x; e.y = owner.y; e.el.style.left = e.x+'px'; e.el.style.top = e.y+'px';
                    if(e.age > (e.type === 'shield_aura' ? 30 : 50)) { e.el.remove(); entities.splice(i, 1); continue; }
                    
                    // Phá đạn bay tới
                    entities.forEach(other => { if(!other.isMine && (other.type==='bullet' || other.type==='shuriken' || other.type==='holy_light' || other.type==='vine')) { if(Math.abs(other.x - e.x) < 50) { other.el.remove(); other.isDead = true; } } });
                    continue;
                }

                if (e.type === 'grenade') { e.x += e.vx; e.y += e.vy; e.vy += 0.8; }
                else if (e.type === 'void_scythe') { e.x += e.vx; e.vx *= 0.9; if(e.age > 25) e.vx -= (e.vx > 0 ? 1 : -1); } 
                else if (e.type !== 'shockwave' && e.type !== 'omega_beam') { e.x += e.vx; e.y += e.vy; } 

                e.el.style.left = e.x + 'px'; e.el.style.top = e.y + 'px';
                if(e.isDead) { entities.splice(i, 1); continue; }
                let target = e.isMine ? getOpp() : getMe();

                // Nổ & Tia
                if (e.type === 'shockwave' || e.type === 'omega_beam') {
                    if(e.age > 15) { e.el.remove(); entities.splice(i, 1); continue; }
                    if(e.age === 5 && !target.isDead) { 
                        if(e.type === 'shockwave' && target.y >= groundY - 20) { if(e.isMine && gameMode==='online') socket.emit('playerHit', {roomId: currentRoom, damage: 30}); if(e.isMine && gameMode==='coop') socket.emit('hitWorldBoss', 30); if(e.isMine || !e.isMine) handleDamage(target, 30, 'explosive', e.isMine); }
                        if(e.type === 'omega_beam' && target.x > e.x && target.x < e.x+800 && target.y > e.y-40 && target.y < e.y+60) { let oDmg=80; if(e.isMine && gameMode==='online') socket.emit('playerHit', {roomId: currentRoom, damage: oDmg}); if(e.isMine && gameMode==='coop') socket.emit('hitWorldBoss', oDmg); if(e.isMine || !e.isMine) handleDamage(target, oDmg, 'energy', e.isMine); }
                    } continue;
                }
                if (e.type === 'bomb') {
                    if (e.age > 180) { 
                        e.el.className = 'bomb-explode'; e.el.innerText = "";
                        if (Math.abs(e.x - target.x) < 90 && Math.abs(e.y - target.y) < 90) { if(e.isMine && gameMode==='online') socket.emit('playerHit', {roomId: currentRoom, damage: 40}); if(e.isMine && gameMode==='coop') socket.emit('hitWorldBoss', 40); if(e.isMine || !e.isMine) handleDamage(target, 40, 'explosive', e.isMine); }
                        setTimeout(() => { if(e.el) e.el.remove(); }, 300); entities.splice(i, 1);
                    } continue;
                } 
                
                let w = 15, h = 15, dmg = 15, dmgType = 'ballistic';
                switch(e.type) {
                    case 'vine': dmg = 5; w=40; dmgType='magic'; break; case 'holy_light': dmg = 15; w=25; h=25; dmgType='energy'; break; case 'horse_charge': dmg = 25; w=80; h=60; dmgType='melee'; break;
                    case 'shuriken': dmg = 8; break; case 'shotgun_bullet': dmg = 10; w = 10; break; case 'sniper_bullet': dmg = 35; w = 40; dmgType='piercing'; break;
                    case 'fireball': dmg = 30; w = 35; h = 35; dmgType='energy'; break; case 'fire_wave': dmg = 25; w = 50; h = 120; dmgType='energy'; break;
                    case 'void_scythe': dmg = 20; w = 45; h = 45; dmgType='piercing'; break; case 'rocket': dmg = 30; w=30; dmgType='explosive'; break; case 'laser': dmg = 20; w = 150; dmgType='energy'; break; case 'grenade': dmg = 25; dmgType='explosive'; break;
                }

                if (e.x > target.x - w && e.x < target.x + 60 && e.y > target.y - h && e.y < target.y + 90 && !target.isDead) {
                    // Logic Dây Leo trói
                    if(e.type === 'vine' && e.isMine) { if(gameMode==='online') socket.emit('applyStun', {roomId: currentRoom, duration: 90}); else if(gameMode==='coop') socket.emit('coopStunBoss', 90); handleStun(target, 90); }
                    
                    if (e.type === 'rocket' && e.vx !== 0) {
                        e.el.className = 'bomb-explode'; e.vx = 0; e.vy = 0; 
                        if(e.isMine && gameMode==='online') socket.emit('playerHit', {roomId: currentRoom, damage: dmg}); if(e.isMine && gameMode==='coop') socket.emit('hitWorldBoss', dmg); if(e.isMine || (!e.isMine && gameMode!=='online' && gameMode!=='coop')) handleDamage(target, dmg, dmgType, e.isMine); 
                        setTimeout(() => { if(e.el) e.el.remove(); }, 300);
                    } else if (e.vx !== 0) {
                        if(e.isMine && gameMode==='online') socket.emit('playerHit', {roomId: currentRoom, damage: dmg}); if(e.isMine && gameMode==='coop') socket.emit('hitWorldBoss', dmg); if(e.isMine || (!e.isMine && gameMode!=='online' && gameMode!=='coop')) handleDamage(target, dmg, dmgType, e.isMine); 
                        if(!e.type.includes('sniper') && !e.type.includes('wave') && !e.type.includes('scythe') && e.type !== 'horse_charge') { e.el.remove(); entities.splice(i, 1); continue; } 
                    }
                }
                if ((e.type === 'grenade' && e.y > groundY + 70) || e.x < -200 || e.x > 1000) { e.el.remove(); entities.splice(i, 1); }
            }
        }

        // --- BOT AI (SIÊU KHÓ) ---
        let botWait = 0; 
        function runBotAI() {
            let bot = p2; let player = p1; if(bot.isDead || player.isDead || bot.stunTimer > 0) return;
            let dist = bot.x - player.x; botWait--;
            
            if(botWait === 15) document.getElementById('player2').classList.add('boss-telegraph');
            if(botWait === 5) document.getElementById('player2').classList.remove('boss-telegraph');

            if (currentBoss === 'shadow' && botWait <= 0 && Math.random() < 0.05) { bot.x = player.x + (player.facingDir * -60); bot.y = player.y; botWait = 30; return; }
            if (currentBoss === 'zephyr' && bot.y >= groundY && Math.random() < 0.08) bot.vy = -16;

            if (botWait > 0) return; 

            let spd = currentBoss === 'zephyr' ? 10 : (currentBoss === 'titan' ? 2 : 5);
            if (dist > 100) { bot.x -= spd; bot.facingDir = -1; } else if (dist < -100) { bot.x += spd; bot.facingDir = 1; }
            else {
                bot.facingDir = dist > 0 ? -1 : 1; let atkRate = currentBoss === 'omega' ? 0.4 : 0.15;
                if (Math.random() < atkRate) { 
                    document.getElementById('player2').classList.add('attacking'); setTimeout(() => document.getElementById('player2').classList.remove('attacking'), 150);
                    let bossDmg = 90; 
                    if(currentBoss === 'titan') { spawnEntity('shockwave', 0, groundY+70, 0, 0, false); botWait = 80; }
                    else if(currentBoss === 'ifrit') { spawnEntity('fire_wave', bot.x+(bot.facingDir*40), bot.y, bot.facingDir*10, 0, false); spawnEntity('fireball', bot.x, bot.y, bot.facingDir*6, 0, false); botWait = 50; }
                    else if(currentBoss === 'omega') { if(Math.random()<0.4) spawnEntity('omega_beam', bot.facingDir===1?bot.x:bot.x-800, bot.y-20, 0, 0, false); else spawnEntity('laser', bot.x, bot.y, bot.facingDir*25, 0, false); botWait = 40; }
                    else { handleDamage(player, currentBoss==='shadow'? 110 : bossDmg, 'melee', false); botWait = 35; }
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            let me = getMe(); if(me.isDead || me.stunTimer > 0) return;
            if(e.key === 'a' || e.key === 'A') keys.a = true; if(e.key === 'd' || e.key === 'D') keys.d = true;
            if(e.key === 'w' || e.key === 'W') { if(me.y >= groundY) { me.vy = -16; me.jumpCount = 1; } else if (me.jumpCount === 1) { me.vy = -14; me.jumpCount = 2; } }
            if(e.key === 'Shift') { me.isBlocking = true; myElement().classList.add('blocking'); }
            if(e.code === 'Space' && !e.repeat) doAttack();
        });

        window.addEventListener('keyup', (e) => {
            let me = getMe();
            if(e.key === 'a' || e.key === 'A') keys.a = false; if(e.key === 'd' || e.key === 'D') keys.d = false;
            if(e.key === 'Shift') { me.isBlocking = false; myElement().classList.remove('blocking'); }
        });

        function resetGameUI() {

            p2 = { x: 650, y: groundY, vy: 0, hp: p2.maxHp, maxHp: p2.maxHp, isDead: false, isBlocking: false, jumpCount: 0, facingDir: -1, stunTimer: 0 };

            document.getElementById('player1').className = 'player'; document.getElementById('hp1').style.width = '100%'; document.getElementById('hp1').style.background = '#66fcf1';
            if(gameMode !== 'online' && gameMode !== 'coop') document.getElementById('player2').className = 'player ' + (currentBoss !== 'normal' ? 'boss-'+currentBoss : '');

        // Đấu lại PvP
        function requestRematchPvP() { document.getElementById('btn-rematch-pvp').innerText = "Chờ đối thủ..."; socket.emit('rematchRequest', currentRoom); }
        socket.on('rematchOffer', () => { document.getElementById('btn-rematch-pvp').innerText = "Đối thủ rủ đấu lại! Bấm đồng ý"; });
        socket.on('rematchStart', () => resetGameUI());

        function gameLoop() {
            let me = getMe();
            if (!p1.isDead) {
                if(me.stunTimer > 0) { me.stunTimer--; keys.a = false; keys.d = false; } // Đứng im khi bị choáng
                else {
                    let speed = me.isBlocking ? 2 : 6;
                    if(keys.a) { me.x = Math.max(0, me.x - speed); me.facingDir = -1; }
                    if(keys.d) { me.x = Math.min(800 - (currentBoss==='titan'||currentBoss==='abyss'?100:60), me.x + speed); me.facingDir = 1; }
                    me.y += me.vy; if (me.y < groundY) me.vy += 0.8; else { me.y = groundY; me.vy = 0; me.jumpCount = 0; }
                }

                if(gameMode === 'bot' && !p2.isDead) {
                    if(p2.stunTimer > 0) { p2.stunTimer--; let el = document.getElementById('player2'); el.classList.add('stunned'); if(p2.stunTimer===0) el.classList.remove('stunned'); }
                    else runBotAI(); 
                }

                if(gameMode === 'online') socket.emit('playerAction', { roomId: currentRoom, playerData: { x: me.x, y: me.y, isBlocking: me.isBlocking, facingDir: me.facingDir } });
                else if (gameMode === 'coop') socket.emit('coopPlayerAction', { x: me.x, y: me.y, isBlocking: me.isBlocking, facingDir: me.facingDir });
            }

            document.getElementById('player1').style.left = p1.x + 'px'; document.getElementById('player1').style.top = p1.y + 'px';
            document.getElementById('player2').style.left = p2.x + 'px'; document.getElementById('player2').style.top = p2.y + 'px';
            if(!p1.isDead) document.getElementById('player1').style.transform = `scaleX(${p1.facingDir})`;
            if(!p2.isDead) document.getElementById('player2').style.transform = `scaleX(${p2.facingDir})`;

            updateEntities(); requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
